<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="__CSP__">
    <title>Browser dashboard</title>
    <style>__STYLE__</style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Browser dashboard</h1>
          <output id="status">Connecting to the MCP client…</output>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <div id="error" role="alert" hidden></div>
      <section class="card" aria-labelledby="preview-heading">
        <div class="card-heading">
          <h2 id="preview-heading">Preview</h2>
        </div>
        <img id="preview" alt="Current browser page" hidden>
      </section>
      <section class="card" aria-labelledby="tabs-heading">
        <h2 id="tabs-heading">Open tabs</h2>
        <ul id="tabs"><li>Loading tabs…</li></ul>
      </section>
    </main>
    <script type="module">__SCRIPT__</script>
  </body>
</html>
