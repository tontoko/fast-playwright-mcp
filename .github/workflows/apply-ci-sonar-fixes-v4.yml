name: Apply CI and SonarQube fixes v4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-ci-sonar-fixes-v4.yml'

permissions:
  contents: write

concurrency:
  group: apply-ci-sonar-fixes-v4-pr31
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-ci-sonar-fixes-v3.yml').read_text(encoding='utf-8')
          step = workflow.index('      - name: Apply reviewed source fixes\n')
          start_marker = '        run: |\n'
          start = workflow.index(start_marker, step) + len(start_marker)
          end = workflow.index('\n      - name: Install dependencies and Chromium', start)
          Path('/tmp/apply-ci-sonar-fixes-v3.sh').write_text(
              textwrap.dedent(workflow[start:end]),
              encoding='utf-8',
          )
          PY
          bash /tmp/apply-ci-sonar-fixes-v3.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/tools/evaluate.ts')
          text = path.read_text(encoding='utf-8')
          import_marker = "import { expectationSchema } from '../schemas/expectation.js';\n"
          tab_import = "import type { Tab } from '../tab.js';\n"
          if tab_import not in text:
              if import_marker not in text:
                  raise SystemExit('src/tools/evaluate.ts: import marker not found')
              text = text.replace(import_marker, import_marker + tab_import, 1)

          helper_marker = '''  return;
          }

          // Enhanced selector schema for browser tools
          '''
          helper = '''  return;
          }

          async function refSelectorCode(
            tab: Tab,
            locator: playwright.Locator
          ): Promise<string | undefined> {
            const text = (await locator.textContent().catch(() => null))
              ?.replace(/\\s+/gu, ' ')
              .trim();
            if (!(text && text.length <= 200)) {
              return;
            }
            return (await tab.page.getByText(text).count()) === 1
              ? `getByText(${quote(text)})`
              : undefined;
          }

          // Enhanced selector schema for browser tools
          '''
          if 'async function refSelectorCode' not in text:
              if helper_marker not in text:
                  raise SystemExit('src/tools/evaluate.ts: helper marker not found')
              text = text.replace(helper_marker, helper, 1)

          old = '''      generatedLocator =
                selectorCode(selected.selector) ?? (await generateLocator(locator));
          '''
          new = '''      generatedLocator =
                selectorCode(selected.selector) ??
                (await refSelectorCode(tab, locator)) ??
                (await generateLocator(locator));
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit('src/tools/evaluate.ts: generated locator marker not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies and Chromium
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          npm ci --prefix extension

      - name: Verify formatting, encoding, types, and build
        shell: bash
        run: |
          set -o pipefail
          {
            bun run lint-fix
            bun run check:encoding
            bun run typecheck
            bun run build:publish
            bun run lint
          } 2>&1 | tee verification.log

      - name: Run affected browser regression tests
        shell: bash
        run: |
          set -o pipefail
          bunx playwright test \
            tests/batch-execute.spec.ts \
            tests/cdp.spec.ts \
            tests/dialogs.spec.ts \
            tests/encoding-policy.spec.ts \
            tests/evaluate.spec.ts \
            tests/files.spec.ts \
            tests/iframes.spec.ts \
            tests/navigation-context.spec.ts \
            tests/response-filtering.spec.ts \
            tests/roots.spec.ts \
            tests/screenshot.spec.ts \
            tests/tab-custom-ref.spec.ts \
            tests/tabs.spec.ts \
            tests/trace.spec.ts \
            tests/webdriver.spec.ts \
            --project=chromium 2>&1 | tee -a verification.log

      - name: Run extension regression tests
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        shell: bash
        run: |
          set -o pipefail
          npm run build --prefix extension 2>&1 | tee -a verification.log
          xvfb-run --auto-servernum bunx playwright test \
            --config=extension/playwright.config.ts 2>&1 | tee -a verification.log

      - name: Upload verification failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-sonar-fix-verification-v4
          path: verification.log
          if-no-files-found: warn
          retention-days: 2

      - name: Commit fixes and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-ci-sonar-fixes.yml
          rm .github/workflows/apply-ci-sonar-fixes-v2.yml
          rm .github/workflows/apply-ci-sonar-fixes-v3.yml
          rm .github/workflows/apply-ci-sonar-fixes-v4.yml
          rm -rf lib test-results playwright-report extension/test-results
          rm -f -- *.tgz tsconfig.tsbuildinfo verification.log
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore browser compatibility and SonarQube scope'
          git push origin HEAD:agent/adaptive-tool-discovery
