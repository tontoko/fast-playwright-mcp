name: Apply verified CDP header type fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/config-type-fix.patch'
      - '.github/workflows/apply-config-type-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-config-type-fix-pr31
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/config-type-fix.patch
          git apply .github/config-type-fix.patch
      - name: Verify type, lint, and configuration regressions
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bunx playwright test tests/upstream-config.spec.ts --project=chromium --workers=1
      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/config-type-fix.patch
          rm .github/workflows/apply-config-type-fix.yml
          rm -rf lib test-results playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve typed CDP header merging'
          git push origin HEAD:agent/adaptive-tool-discovery
