name: Export development environment

on:
  pull_request:
    branches:
      - fix/all-open-issues
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Package development environment
        run: |
          cp "$(command -v bun)" ./bun-linux-x64
          tar -czf fast-playwright-mcp-dev-env.tar.gz node_modules bun-linux-x64
      - name: Upload development environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-playwright-mcp-dev-env
          path: fast-playwright-mcp-dev-env.tar.gz
          if-no-files-found: error
          retention-days: 1
