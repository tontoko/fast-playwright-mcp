# run: clean-input-1
name: PR 31 clean verification

on:
  push:
    branches:
      - agent/pr31-verify-clean
    paths:
      - '.github/workflows/pr31-clean-verification.yml'

permissions:
  contents: write

concurrency:
  group: pr31-clean-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-verify-clean
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Apply reviewed relay hardening
        run: python3 scripts/apply-pr31-final-fixes.py
      - name: Install dependencies and Chromium
        run: |
          bun install
          bunx playwright install --with-deps chromium
      - name: Static verification and generated artifacts
        run: |
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run update-readme
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check
          bun run upstream:check:fixture > /tmp/upstream-report.md
          grep -q '## Playwright MCP' /tmp/upstream-report.md
          grep -q '## Playwright runtime' /tmp/upstream-report.md
          git diff --check
      - name: Focused review, security, and upstream regressions
        run: |
          bunx playwright test \
            tests/cdp-relay-launch.spec.ts \
            tests/cdp-relay-security.spec.ts \
            tests/dashboard-refresh.spec.ts \
            tests/session-log-eviction.spec.ts \
            tests/screenshot-webp.spec.ts \
            tests/upstream-dual-audit.spec.ts \
            tests/upstream-check.spec.ts \
            tests/upstream-runtime.spec.ts \
            tests/adaptive-config.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/mcp-server-initialize.spec.ts \
            tests/network-origin-filter.spec.ts \
            tests/output-manager.spec.ts \
            tests/partial-snapshot-css.spec.ts \
            tests/readme-contract.spec.ts \
            tests/secret-redaction.spec.ts \
            tests/session-log-redaction.spec.ts \
            tests/session-log.spec.ts \
            tests/tool-gateways.spec.ts \
            --project=chromium \
            --workers=1
      - name: Full Chromium suite
        run: bunx playwright test --project=chromium --workers=2
      - name: Packed npm artifact smoke
        run: bun run test:package
      - name: Install remaining browsers
        run: bunx playwright install --with-deps chrome msedge firefox webkit
      - name: Full Chrome suite
        run: bunx playwright test --project=chrome --workers=1
      - name: Full Microsoft Edge suite
        run: bunx playwright test --project=msedge --workers=1
      - name: Full Firefox suite
        run: bunx playwright test --project=firefox --workers=1
      - name: Full WebKit suite
        run: bunx playwright test --project=webkit --workers=1
      - name: Extension build and E2E
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        run: |
          npm ci --prefix extension
          npm run build --prefix extension
          xvfb-run --auto-servernum bunx playwright test \
            --config=extension/playwright.config.ts \
            --workers=1
      - name: Docker build and CLI smoke
        run: |
          docker build -t fast-playwright-mcp-pr31:latest .
          docker run --rm fast-playwright-mcp-pr31:latest --version
      - name: Commit verified tree
        run: |
          printf '# PR 31 clean verification\n\n' > VERIFY_RESULT.md
          printf -- '- static verification: passed\n' >> VERIFY_RESULT.md
          printf -- '- focused regressions: passed\n' >> VERIFY_RESULT.md
          printf -- '- Chromium: passed\n' >> VERIFY_RESULT.md
          printf -- '- Chrome: passed\n' >> VERIFY_RESULT.md
          printf -- '- Microsoft Edge: passed\n' >> VERIFY_RESULT.md
          printf -- '- Firefox: passed\n' >> VERIFY_RESULT.md
          printf -- '- WebKit: passed\n' >> VERIFY_RESULT.md
          printf -- '- package smoke: passed\n' >> VERIFY_RESULT.md
          printf -- '- extension E2E: passed\n' >> VERIFY_RESULT.md
          printf -- '- Docker smoke: passed\n' >> VERIFY_RESULT.md
          rm -rf lib test-results playwright-report extension/dist \
            extension/test-results extension/playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git rm .github/workflows/pr31-clean-verification.yml
          git rm scripts/apply-pr31-final-fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete PR 31 review and upstream refresh [verified]'
          git push origin HEAD:agent/pr31-verify-clean
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6
        with:
          name: pr31-clean-verification-failure
          path: |
            test-results/**/error-context.md
            playwright-report/**
            extension/test-results/**/error-context.md
            extension/playwright-report/**
          if-no-files-found: warn
          retention-days: 3
