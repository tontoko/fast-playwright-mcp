name: Export source

on:
  pull_request:
    branches:
      - fix/all-open-issues
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
      - name: Create source archive
        run: git archive --format=zip --output=fast-playwright-mcp-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-playwright-mcp-source
          path: fast-playwright-mcp-source.zip
          if-no-files-found: error
          retention-days: 1
