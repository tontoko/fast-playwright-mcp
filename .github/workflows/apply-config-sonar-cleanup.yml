name: Apply remaining config Sonar cleanup

on:
  push:
    branches:
      - agent/sonar-quality-gate-fixes
    paths:
      - '.github/config-sonar-cleanup.patch'
      - '.github/workflows/apply-config-sonar-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: apply-config-sonar-cleanup
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[config-cleanup-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/sonar-quality-gate-fixes
          fetch-depth: 0
      - name: Apply and commit config cleanup
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/config-sonar-cleanup.patch
          git apply .github/config-sonar-cleanup.patch
          rm .github/config-sonar-cleanup.patch
          rm .github/workflows/apply-config-sonar-cleanup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove redundant config fallbacks [config-cleanup-applied]'
          git push origin HEAD:agent/sonar-quality-gate-fixes
