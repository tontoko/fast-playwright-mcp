name: Export current pull request 31 source

on:
  pull_request:
    branches:
      - agent/pr31-staging-base
    paths:
      - .github/workflows/export-current-pr31.yml

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - name: Export exact branch tree
        run: git archive --format=zip --output=pr31-current-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr31-current-source
          path: pr31-current-source.zip
          if-no-files-found: error
          retention-days: 1
