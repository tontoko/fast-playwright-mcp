name: Apply complete implementation v2

on:
  pull_request:
    branches:
      - fix/all-open-issues
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-complete-implementation-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      BUNDLE_URL: https://filebin.net/fp-oai-9f6c1e3a1c214aba9fa5e2c1a65f2026/fast-playwright-complete.tar.gz
      CHECKSUM_URL: https://filebin.net/fp-oai-9f6c1e3a1c214aba9fa5e2c1a65f2026/fast-playwright-complete.sha256
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --location "$BUNDLE_URL" --output /tmp/complete.tar.gz && \
               curl --fail --location "$CHECKSUM_URL" --output /tmp/complete.sha256; then
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 15))
          done
          expected=$(awk '{print $1}' /tmp/complete.sha256)
          actual=$(sha256sum /tmp/complete.tar.gz | awk '{print $1}')
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Replace worktree and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/complete.tar.gz -C .
          rm -f \
            .github/workflows/apply-complete-bundle.yml \
            .github/workflows/apply-complete-bundle-v2.yml \
            .github/workflows/adaptive-tool-discovery-ci.yml \
            .github/workflows/implementation-sync.yml \
            .github/workflows/export-source.yml \
            .github/workflows/export-development-environment.yml
          rm -rf docs/superpowers tmp

      - name: Enforce repository automation policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'issues:[[:space:]]*write|gh[[:space:]]+issue|gh[[:space:]]+pr[[:space:]]+(close|merge)|pull-requests:[[:space:]]*write' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Unexpected issue or pull-request mutation found.' >&2
            exit 1
          fi
          while IFS= read -r line; do
            ref=${line#*@}
            ref=${ref%% *}
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Action is not pinned to a full commit SHA: $line" >&2
              exit 1
            }
          done < <(grep -RhE '^[[:space:]]*-[[:space:]]+uses:' .github/workflows)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static and generated checks
        shell: bash
        run: |
          set -euo pipefail
          bun run build:dashboard
          git diff --exit-code -- src/apps/generated/dashboard.ts
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check
          bun run upstream:check:fixture > /tmp/upstream-a.md
          bun run upstream:check:fixture > /tmp/upstream-b.md
          diff -u /tmp/upstream-a.md /tmp/upstream-b.md

      - name: Install browsers
        run: bunx playwright install --with-deps chromium chrome msedge firefox webkit

      - name: Run focused contract and security suite
        shell: bash
        run: |
          set -euo pipefail
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            tests/tool-gateways.spec.ts \
            tests/browser-find.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/output-manager.spec.ts \
            tests/secret-redaction.spec.ts \
            tests/mcp-resources.spec.ts \
            tests/dashboard-build.spec.ts \
            tests/dashboard-render.spec.ts \
            tests/dashboard-e2e.spec.ts \
            --project=chromium

      - name: Run browser projects with one retry
        shell: bash
        run: |
          set -euo pipefail
          retry_project() {
            local project=$1
            bunx playwright test --project="$project" || bunx playwright test --project="$project"
          }
          retry_project chrome
          retry_project chromium
          retry_project msedge
          retry_project firefox
          retry_project webkit

      - name: Verify packed package
        run: bun run test:package

      - name: Build and test extension with one retry
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix extension
          npm run build --prefix extension
          xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts || \
            xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts

      - name: Docker build and smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag fast-playwright-mcp-complete:ci .
          docker run --rm fast-playwright-mcp-complete:ci --version

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report
          rm -f *.tgz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: complete adaptive MCP platform improvements'
            git push origin HEAD:agent/adaptive-tool-discovery
          fi

      - name: Update only this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          This pull request consolidates the repository maintenance and architecture work into one reviewed change set.

          It includes:

          - restored and hardened CI coverage with immutable GitHub Action references
          - an adaptive MCP tool catalog with `adaptive`, `minimal`, and `full` profiles
          - deterministic tool discovery and schema-validated read-only/action gateways
          - compact accessibility-snapshot search and enforced context budgets
          - selected Microsoft Playwright MCP compatibility and security improvements while retaining the local lint and formatting toolchain
          - read-only upstream compatibility reporting and source attribution
          - an offline, opt-in MCP Apps dashboard with CSP and XSS-focused tests
          - package-install, browser, extension, Docker, and protocol conformance coverage

          The default adaptive catalog exposes seven tools and keeps the serialized startup list below the enforced 12,000-byte budget. Existing static behavior remains available with `--tool-profile=full`.

          This pull request does not edit, close, label, or comment on repository issues or other contributors' pull requests.

          ## Validation

          - typecheck, production build, lint, and generated-file cleanliness
          - context-budget and upstream-report determinism checks
          - Chromium contract and security suites
          - Chrome, Chromium, Microsoft Edge, Firefox, and WebKit suites
          - packed npm artifact installation and MCP startup
          - browser extension build and E2E
          - Docker build and CLI smoke test
          EOF
          gh pr edit 31 --repo "$GITHUB_REPOSITORY" --base main --title 'feat: improve tool discovery, upstream compatibility, and MCP Apps support' --body-file /tmp/pr-body.md
          gh pr ready 31 --repo "$GITHUB_REPOSITORY"
