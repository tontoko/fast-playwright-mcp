name: Probe Sonar and GitHub check status

on:
  push:
    branches:
      - agent/sonar-status-probe
    paths:
      - '.github/workflows/sonar-status-probe.yml'
      - '.github/sonar-probe/TRIGGER'

permissions:
  contents: write
  checks: read
  statuses: read

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[sonar-probe-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: e2ab913e704c0eeb16cb3343d609fce323bb634c
      TARGET_PR: '31'
      PROJECT_KEY: tontoko_fast-playwright-mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/sonar-status-probe
          fetch-depth: 0
      - name: Query current Sonar analysis
        shell: bash
        run: |
          set -euo pipefail
          root='.github/sonar-probe'
          mkdir -p "$root"
          fetch() {
            local endpoint="$1"
            local output="$2"
            curl --silent --show-error --fail --location \
              --max-time 40 \
              --user-agent 'fast-playwright-mcp-sonar-probe/3.0' \
              "https://sonarcloud.io/api/${endpoint}" > "$root/${output}"
          }
          fetch "project_pull_requests/list?project=${PROJECT_KEY}" pull-requests.json
          fetch "qualitygates/project_status?projectKey=${PROJECT_KEY}&pullRequest=${TARGET_PR}" quality-gate.json
          fetch "issues/search?componentKeys=${PROJECT_KEY}&pullRequest=${TARGET_PR}&resolved=false&ps=500" issues.json
          fetch "measures/component?component=${PROJECT_KEY}&pullRequest=${TARGET_PR}&metricKeys=new_reliability_rating,new_security_rating,new_maintainability_rating,new_bugs,new_vulnerabilities,new_code_smells,new_duplicated_lines_density,new_security_hotspots_reviewed" measures.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.github/sonar-probe')
          target_sha = 'e2ab913e704c0eeb16cb3343d609fce323bb634c'

          def load(name: str):
              return json.loads((root / name).read_text(encoding='utf-8'))

          pull_requests = load('pull-requests.json').get('pullRequests', [])
          pr = next((item for item in pull_requests if str(item.get('key')) == '31'), {})
          gate = load('quality-gate.json').get('projectStatus', {})
          issues = load('issues.json')
          measure_payload = load('measures.json')
          measures = {
              item.get('metric'): item.get('period', {}).get('value', item.get('value'))
              for item in measure_payload.get('component', {}).get('measures', [])
          }
          lines = [
              '# Current PR 31 Sonar status',
              '',
              f'- target SHA: {target_sha}',
              f"- analyzed revision: {pr.get('revision')}",
              f"- analysis date: {pr.get('analysisDate')}",
              f"- quality gate: {gate.get('status')}",
              f"- unresolved issues: {issues.get('total')}",
              '',
              '## Measures',
          ]
          for key in sorted(measures):
              lines.append(f'- {key}: {measures[key]}')
          lines.extend(['', '## Conditions'])
          for condition in gate.get('conditions', []):
              lines.append(
                  f"- {condition.get('metricKey')}: status={condition.get('status')}, "
                  f"actual={condition.get('actualValue')}, threshold={condition.get('errorThreshold')}"
              )
          (root / 'RESULTS.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/sonar-probe
          git commit -m 'chore: record current PR 31 Sonar probe [sonar-probe-result]'
          git push origin HEAD:agent/sonar-status-probe
