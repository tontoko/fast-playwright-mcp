name: Apply verified final source to pull request 31

on:
  push:
    branches:
      - agent/adaptive-tool-discovery

permissions:
  contents: write

concurrency:
  group: apply-verified-pr31-source
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Decode and verify final source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/final-source/source.b64 > /tmp/pr31-final-source.tar.gz
          echo '27d65493395b70d06baabd1a96a64dd4f3bcdfd3fb6d1b0d3b9b501b3570e0bc  /tmp/pr31-final-source.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/pr31-final-source.tar.gz > /tmp/pr31-final-source-files.txt
          if grep -E '(^|/)\.git(/|$)|(^|/)\.\./|(^|/)node_modules(/|$)' /tmp/pr31-final-source-files.txt; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          if tar -tvzf /tmp/pr31-final-source.tar.gz | awk '$1 ~ /^l/ { found=1 } END { exit !found }'; then
            echo 'Symlink detected in source archive.' >&2
            exit 1
          fi

      - name: Replace staging branch contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/pr31-final-source.tar.gz -C .
          test ! -e .github/final-source
          test ! -e tmp
          if find .github/workflows -maxdepth 1 -type f \( \
            -name 'adaptive-tool-discovery-ci.yml' -o \
            -name 'apply-complete-bundle*.yml' -o \
            -name 'apply-final-source*.yml' -o \
            -name 'apply-pr31-source-archive.yml' -o \
            -name 'diagnose-final-source.yml' -o \
            -name 'export-current-pr31.yml' -o \
            -name 'export-dev-env.yml' -o \
            -name 'export-source.yml' -o \
            -name 'finalize-pr31*.yml' -o \
            -name 'implementation-sync.yml' \
          \) | grep -q .; then
            echo 'Temporary workflow remained in final source.' >&2
            exit 1
          fi

      - name: Verify repository workflow policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'issues:[[:space:]]*write|gh[[:space:]]+issue|gh[[:space:]]+pr[[:space:]]+(close|merge)' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Repository workflows must not mutate issues or unrelated pull requests.' >&2
            exit 1
          fi
          while IFS= read -r line; do
            ref=${line#*@}
            ref=${ref%% *}
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Unpinned GitHub Action: $line" >&2
              exit 1
            }
          done < <(grep -RhE '^[[:space:]]*-[[:space:]]+uses:' .github/workflows)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify deterministic dashboard generation
        shell: bash
        run: |
          set -euo pipefail
          cp src/apps/generated/dashboard.ts /tmp/dashboard-before.ts
          bun run build:dashboard
          cmp /tmp/dashboard-before.ts src/apps/generated/dashboard.ts
          cp src/apps/generated/dashboard.ts /tmp/dashboard-first.ts
          bun run build:dashboard
          cmp /tmp/dashboard-first.ts src/apps/generated/dashboard.ts

      - name: Typecheck, build, lint, and context budget
        run: |
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check

      - name: Verify deterministic upstream report
        shell: bash
        run: |
          set -euo pipefail
          bun run upstream:check:fixture > /tmp/upstream-a.md
          bun run upstream:check:fixture > /tmp/upstream-b.md
          diff -u /tmp/upstream-a.md /tmp/upstream-b.md

      - name: Install Chromium for focused validation
        run: bunx playwright install --with-deps chromium

      - name: Run focused contract and security tests
        run: |
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            tests/tool-gateways.spec.ts \
            tests/tool-context-budget.spec.ts \
            tests/browser-find.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/output-manager.spec.ts \
            tests/secret-redaction.spec.ts \
            tests/mcp-resources.spec.ts \
            tests/dashboard-build.spec.ts \
            tests/dashboard-render.spec.ts \
            tests/dashboard-e2e.spec.ts \
            tests/upstream-check.spec.ts \
            tests/upstream-config.spec.ts \
            tests/review-threads.spec.ts \
            --project=chromium

      - name: Verify packed package and extension build
        run: |
          bun run test:package
          npm ci --prefix extension
          npm run build --prefix extension

      - name: Commit verified clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report extension/dist
          rm -f -- *.tgz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete tool discovery and upstream compatibility'
          git push origin HEAD:agent/adaptive-tool-discovery
