name: Diagnose WebKit tab failure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-ci-fixes.yml'
      - '.github/ci-fixes-v2.patch'

permissions:
  contents: read

concurrency:
  group: diagnose-webkit-tab-pr31
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply exact source patch and enable verbose child diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '6ee24fc2eb6acb8c84e9c8d15870928c085a86adb309b87d2d6150c47240295f  .github/ci-fixes-v2.patch' | sha256sum --check --strict
          git apply --check .github/ci-fixes-v2.patch
          git apply .github/ci-fixes-v2.patch
          python3 - <<'PY'
          from pathlib import Path
          fixture = Path('tests/fixtures.ts')
          text = fixture.read_text(encoding='utf-8')
          marker = "DEBUG: 'pw:mcp:test',"
          replacement = "DEBUG: process.env.DEBUG ?? 'pw:mcp:test',"
          if marker not in text:
              raise SystemExit('tests/fixtures.ts: DEBUG marker not found')
          fixture.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Install dependencies and WebKit
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps webkit

      - name: Reproduce one failing tab operation
        env:
          DEBUG: 'pw:mcp:*,pw:browser*,pw:api'
          PWMCP_DEBUG: '1'
        shell: bash
        run: |
          set -o pipefail
          bun run build:publish 2>&1 | tee webkit-debug.log
          bunx playwright test tests/tabs.spec.ts \
            --project=webkit \
            --workers=1 \
            --grep='list first tab' 2>&1 | tee -a webkit-debug.log

      - name: Upload WebKit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-tab-debug-log
          path: |
            webkit-debug.log
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 2
