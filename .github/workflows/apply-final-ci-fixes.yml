name: Verify WebKit navigation fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-ci-fixes.yml'
      - '.github/ci-fixes-v2.patch'
      - '.github/tab-navigation-fix.patch'

permissions:
  contents: write

concurrency:
  group: verify-webkit-navigation-pr31
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply exact source patches
        shell: bash
        run: |
          set -euo pipefail
          echo '1cc0f851328bcf0608a37c4ebb5c63f90675f1019d00bc2d3f4691473ff4efbb  .github/ci-fixes-v2.patch' | sha256sum --check --strict
          echo 'eccf2a6e65d8adf6c4b345a0a9a0c0d4a7b46e3806045475adfc4743d5eadc2f  .github/tab-navigation-fix.patch' | sha256sum --check --strict
          git apply --check .github/ci-fixes-v2.patch
          git apply .github/ci-fixes-v2.patch
          git apply --check .github/tab-navigation-fix.patch
          git apply .github/tab-navigation-fix.patch
          python3 - <<'PY'
          from pathlib import Path
          Path('.sonarcloud.properties').read_text(encoding='utf-8', errors='strict')
          PY
          if grep -E '^sonar\.(sources|tests)=.*[*?]' .sonarcloud.properties; then
            echo 'Wildcards are not allowed in Sonar automatic-analysis source/test roots.' >&2
            exit 1
          fi

      - name: Install dependencies and browsers
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium firefox webkit

      - name: Verify source, encoding, and regressions
        env:
          PWMCP_DEBUG: '1'
        shell: bash
        run: |
          set -o pipefail
          {
            bun run lint-fix
            bun run check:encoding
            bun run typecheck
            bun run build:publish
            bun run lint
            bunx playwright test \
              tests/upstream-config.spec.ts \
              tests/tool-gateways.spec.ts \
              --project=chromium
            bunx playwright test \
              tests/tabs.spec.ts \
              tests/batch-execute-basic.spec.ts \
              --project=webkit
            bunx playwright test \
              tests/tabs.spec.ts \
              tests/browser-find.spec.ts \
              tests/batch-execute-basic.spec.ts \
              --project=firefox
          } 2>&1 | tee verification.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-navigation-fix-failure
          path: |
            verification.log
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 2

      - name: Commit clean verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-final-ci-fixes.yml
          rm -f .github/ci-fixes-v2.patch .github/tab-navigation-fix.patch
          rm -rf lib test-results playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo verification.log
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize browser matrix and Sonar analysis'
          git push origin HEAD:agent/adaptive-tool-discovery
