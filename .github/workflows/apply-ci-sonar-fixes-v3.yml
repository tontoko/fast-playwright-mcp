name: Apply CI and SonarQube fixes v3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-ci-sonar-fixes-v3.yml'

permissions:
  contents: write

concurrency:
  group: apply-ci-sonar-fixes-v3-pr31
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-ci-sonar-fixes.yml').read_text(encoding='utf-8')
          start_marker = '          from pathlib import Path\n'
          end_marker = '\n          PY\n\n      - name: Install and verify source changes'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/apply-ci-sonar-fixes.py').write_text(
              textwrap.dedent(workflow[start:end]),
              encoding='utf-8',
          )
          PY
          python3 /tmp/apply-ci-sonar-fixes.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/response.ts')
          text = path.read_text(encoding='utf-8')
          old = "import type { Tab, TabSnapshot } from './tab.js';"
          new = "import { renderModalStates, type Tab, type TabSnapshot } from './tab.js';"
          if old not in text and new not in text:
              raise SystemExit('src/response.ts: tab import marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > scripts/check-encoding.ts <<'EOF'
          import { readdir, readFile } from 'node:fs/promises';
          import { extname, join, relative } from 'node:path';

          const ROOT = process.cwd();
          const SKIPPED_DIRECTORIES = new Set([
            '.git',
            '.scannerwork',
            'build',
            'coverage',
            'dist',
            'lib',
            'node_modules',
            'playwright-report',
            'test-results',
          ]);
          const BINARY_EXTENSIONS = new Set([
            '.gif',
            '.gz',
            '.ico',
            '.jpeg',
            '.jpg',
            '.otf',
            '.pdf',
            '.png',
            '.tgz',
            '.ttf',
            '.wasm',
            '.webp',
            '.woff',
            '.woff2',
            '.zip',
          ]);
          const UTF8_BOM = Buffer.from([0xef, 0xbb, 0xbf]);

          function collectEntry(
            directory: string,
            entry: Awaited<ReturnType<typeof readdir>>[number]
          ): Promise<string[]> {
            if (entry.isSymbolicLink()) {
              return Promise.resolve([]);
            }
            const path = join(directory, entry.name);
            if (entry.isDirectory()) {
              return SKIPPED_DIRECTORIES.has(entry.name)
                ? Promise.resolve([])
                : collectFiles(path);
            }
            return Promise.resolve(entry.isFile() ? [path] : []);
          }

          async function collectFiles(directory: string): Promise<string[]> {
            const entries = await readdir(directory, { withFileTypes: true });
            const results = await Promise.all(
              entries.map((entry) => collectEntry(directory, entry))
            );
            return results.flat();
          }

          function validateText(data: Buffer): string | undefined {
            if (data.subarray(0, UTF8_BOM.length).equals(UTF8_BOM)) {
              return 'UTF-8 BOM is not allowed';
            }
            if (data.includes(0)) {
              return 'contains NUL bytes but is not declared as a binary file';
            }
            try {
              new TextDecoder('utf-8', { fatal: true }).decode(data);
              return;
            } catch (error) {
              return `is not valid UTF-8: ${
                error instanceof Error ? error.message : String(error)
              }`;
            }
          }

          export async function validateRepositoryEncoding(
            root = ROOT
          ): Promise<string[]> {
            const textFiles = (await collectFiles(root)).filter(
              (path) => !BINARY_EXTENSIONS.has(extname(path).toLowerCase())
            );
            return (
              await Promise.all(
                textFiles.map(async (path) => {
                  const problem = validateText(await readFile(path));
                  return problem
                    ? `${relative(root, path)}: ${problem}`
                    : undefined;
                })
              )
            ).filter((failure): failure is string => Boolean(failure));
          }

          if (import.meta.main) {
            const failures = await validateRepositoryEncoding();
            if (failures.length) {
              throw new Error(
                `Source encoding check failed:\n${failures.join('\n')}`
              );
            }
            process.stdout.write('Source encoding check passed.\n');
          }
          EOF

          cat > tests/encoding-policy.spec.ts <<'EOF'
          import { readFile } from 'node:fs/promises';
          import { expect, test } from '@playwright/test';

          function property(text: string, name: string): string | undefined {
            return text
              .split('\n')
              .find((line) => line.startsWith(`${name}=`))
              ?.slice(name.length + 1);
          }

          test('scanner-facing source files are valid UTF-8', async () => {
            const { validateRepositoryEncoding } = await import(
              '../scripts/check-encoding.js'
            );
            await expect(validateRepositoryEncoding()).resolves.toEqual([]);
          });

          test('SonarQube encoding and generated-file exclusions are explicit', async () => {
            const [scannerProperties, automaticProperties] = await Promise.all([
              readFile('sonar-project.properties', 'utf8'),
              readFile('.sonarcloud.properties', 'utf8'),
            ]);
            expect(property(scannerProperties, 'sonar.sourceEncoding')).toBe('UTF-8');
            expect(property(scannerProperties, 'sonar.exclusions')?.split(',')).toEqual(
              expect.arrayContaining([
                'src/apps/generated/**',
                '**/*.b64',
                '**/*.tsbuildinfo',
              ])
            );
            expect(property(automaticProperties, 'sonar.sourceEncoding')).toBe('UTF-8');
            expect(property(automaticProperties, 'sonar.sources')?.split(',')).toEqual(
              expect.arrayContaining(['src', 'extension/src', 'scripts', 'benchmark'])
            );
            expect(
              property(automaticProperties, 'sonar.exclusions')?.split(',')
            ).toContain('src/apps/generated/dashboard.ts');
          });
          EOF

      - name: Install dependencies and Chromium
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          npm ci --prefix extension

      - name: Verify formatting, encoding, types, and build
        shell: bash
        run: |
          set -o pipefail
          {
            bun run lint-fix
            bun run check:encoding
            bun run typecheck
            bun run build:publish
            bun run lint
          } 2>&1 | tee verification.log

      - name: Run affected browser regression tests
        shell: bash
        run: |
          set -o pipefail
          bunx playwright test \
            tests/batch-execute.spec.ts \
            tests/cdp.spec.ts \
            tests/dialogs.spec.ts \
            tests/encoding-policy.spec.ts \
            tests/evaluate.spec.ts \
            tests/files.spec.ts \
            tests/iframes.spec.ts \
            tests/navigation-context.spec.ts \
            tests/response-filtering.spec.ts \
            tests/roots.spec.ts \
            tests/screenshot.spec.ts \
            tests/tab-custom-ref.spec.ts \
            tests/tabs.spec.ts \
            tests/trace.spec.ts \
            tests/webdriver.spec.ts \
            --project=chromium 2>&1 | tee -a verification.log

      - name: Run extension regression tests
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        shell: bash
        run: |
          set -o pipefail
          npm run build --prefix extension 2>&1 | tee -a verification.log
          xvfb-run --auto-servernum bunx playwright test \
            --config=extension/playwright.config.ts 2>&1 | tee -a verification.log

      - name: Upload verification failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-sonar-fix-verification-v3
          path: verification.log
          if-no-files-found: warn
          retention-days: 2

      - name: Commit fixes and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-ci-sonar-fixes.yml
          rm .github/workflows/apply-ci-sonar-fixes-v2.yml
          rm .github/workflows/apply-ci-sonar-fixes-v3.yml
          rm -rf lib test-results playwright-report extension/test-results
          rm -f -- *.tgz tsconfig.tsbuildinfo verification.log
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore browser compatibility and SonarQube scope'
          git push origin HEAD:agent/adaptive-tool-discovery
