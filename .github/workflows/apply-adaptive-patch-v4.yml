name: Apply adaptive profile integration v4

on:
  pull_request:
    branches:
      - fix/all-open-issues

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - name: Check whether integration is complete
        id: stage
        shell: bash
        run: |
          if grep -q "toolProfile?: ToolProfile" config.d.ts; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.stage.outputs.needed == 'true'
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.stage.outputs.needed == 'true'
        with:
          node-version: '22'
      - name: Install dependencies
        if: steps.stage.outputs.needed == 'true'
        run: bun install --frozen-lockfile
      - name: Apply profile integration
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: source marker not found: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/mcp/tool.ts',
              "import { zodToJsonSchema } from 'zod-to-json-schema';\n\nexport type ToolSchema<Input extends z.Schema> = {\n  name: string;\n  title: string;\n  description: string;\n  inputSchema: Input;\n  type: 'readOnly' | 'destructive';\n};",
              "import { zodToJsonSchema } from 'zod-to-json-schema';\nimport type { ToolSchema } from './types.js';\n\nexport type { ToolEffect, ToolSchema } from './types.js';",
          )
          replace_once(
              'config.d.ts',
              "  | 'pdf';\n\nexport type Config = {",
              "  | 'pdf';\n\nexport type ToolProfile = 'adaptive' | 'full' | 'minimal';\n\nexport type Config = {\n  /** Tool catalog profile. Defaults to adaptive. */\n  toolProfile?: ToolProfile;",
          )
          replace_once(
              'src/config.ts',
              "import type { Config, ToolCapability } from '../config.js';",
              "import type { Config, ToolCapability, ToolProfile } from '../config.js';",
          )
          replace_once(
              'src/config.ts',
              'export type CLIOptions = {\n',
              'export type CLIOptions = {\n  toolProfile?: ToolProfile;\n',
          )
          replace_once(
              'src/config.ts',
              'const defaultConfig: FullConfig = {\n',
              "const defaultConfig: FullConfig = {\n  toolProfile: 'adaptive',\n",
          )
          replace_once(
              'src/config.ts',
              'export type FullConfig = Config & {\n',
              'export type FullConfig = Config & {\n  toolProfile: ToolProfile;\n',
          )
          replace_once(
              'src/config.ts',
              "    | 'capabilities'\n    | 'saveSession'",
              "    | 'toolProfile'\n    | 'capabilities'\n    | 'saveSession'",
          )
          replace_once(
              'src/config.ts',
              "  'capabilities' | 'saveSession' | 'saveTrace' | 'outputDir' | 'imageResponses'",
              "  | 'toolProfile'\n  | 'capabilities'\n  | 'saveSession'\n  | 'saveTrace'\n  | 'outputDir'\n  | 'imageResponses'",
          )
          replace_once(
              'src/config.ts',
              '  return {\n    capabilities: cliOptions.caps as ToolCapability[],',
              '  return {\n    toolProfile: cliOptions.toolProfile,\n    capabilities: cliOptions.caps as ToolCapability[],',
          )
          replace_once(
              'src/config.ts',
              'function populateMiscellaneousOptions(options: CLIOptions): void {\n',
              "function populateMiscellaneousOptions(options: CLIOptions): void {\n  options.toolProfile = process.env.FAST_PLAYWRIGHT_TOOL_PROFILE\n    ? parseToolProfile(process.env.FAST_PLAYWRIGHT_TOOL_PROFILE)\n    : undefined;\n",
          )
          replace_once(
              'src/config.ts',
              'export function semicolonSeparatedList(\n',
              "export function parseToolProfile(value: string): ToolProfile {\n  if (value === 'adaptive' || value === 'full' || value === 'minimal') {\n    return value;\n  }\n  throw new Error(`Invalid tool profile: ${value}`);\n}\n\nexport function semicolonSeparatedList(\n",
          )
          replace_once(
              'src/program.ts',
              '  commaSeparatedList,\n  resolveCLIConfig,',
              '  commaSeparatedList,\n  parseToolProfile,\n  resolveCLIConfig,',
          )
          replace_once(
              'src/program.ts',
              "  .option('--cdp-endpoint <endpoint>', 'CDP endpoint to connect to.')",
              "  .option(\n    '--tool-profile <profile>',\n    'tool catalog profile: adaptive, full, or minimal',\n    parseToolProfile\n  )\n  .option('--cdp-endpoint <endpoint>', 'CDP endpoint to connect to.')",
          )
          replace_once(
              'src/tools.ts',
              "import type { AnyTool } from './tools/tool.js';",
              "import { ToolRegistry, registerTools } from './tools/catalog/registry.js';\nimport type { AnyTool } from './tools/tool.js';",
          )
          tools_path = Path('src/tools.ts')
          tools = tools_path.read_text(encoding='utf-8')
          if 'export function createBaseToolRegistry' not in tools:
              tools += "\nexport function createBaseToolRegistry(config: FullConfig): ToolRegistry {\n  return new ToolRegistry(registerTools(filteredTools(config)));\n}\n"
          tools_path.write_text(tools, encoding='utf-8')
          PY
      - name: Format
        if: steps.stage.outputs.needed == 'true'
        run: bun run lint-fix
      - name: Verify integration
        if: steps.stage.outputs.needed == 'true'
        run: |
          bun run build:publish
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            --project=chromium
          bun run lint
      - name: Commit integration
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate adaptive tool catalog foundation'
          git push origin HEAD:agent/adaptive-tool-discovery
