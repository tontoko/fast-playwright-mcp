name: Format issue-fix branch

on:
  push:
    branches: [fix/all-open-issues]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'tontoko/fast-playwright-mcp' && github.ref == 'refs/heads/fix/all-open-issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-open-issues
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Apply formatter
        run: bun run lint-fix
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply repository formatter"
          git push origin HEAD:fix/all-open-issues
