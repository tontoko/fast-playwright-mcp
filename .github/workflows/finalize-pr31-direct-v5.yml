name: Finalize PR 31 source

on:
  push:
    branches: [agent/pr31-final-review]
    paths: ['.github/workflows/finalize-pr31-direct-v5.yml']

permissions:
  contents: write

concurrency:
  group: finalize-pr31-direct
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-final-review
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Reconstruct prepared implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/pr31-review-fixes:refs/remotes/origin/agent/pr31-review-fixes
          cat scripts/apply-pr31-final.py.gz.b64.* > /tmp/pr31-payload.b64
          printf '%s  %s\n' \
            '6248edd96a856f8a59b05b8ac5cc8294ff3d8219eb13c20b2a4d23e6858b0022' \
            /tmp/pr31-payload.b64 | sha256sum --check
          base64 --decode /tmp/pr31-payload.b64 | gzip --decompress > scripts/apply-pr31-final.py
          printf '%s  %s\n' \
            '6a95d924a4d0051c3db738f1e126776a51f3ab8185231cc24c49a7d7fa3a0d0d' \
            scripts/apply-pr31-final.py | sha256sum --check
          python3 -m py_compile scripts/apply-pr31-final.py

      - name: Install baseline and generate RED tests
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          python3 scripts/apply-pr31-final.py tests
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/dialog-lifecycle.spec.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(".join('\n');", r".join('\n');")
          click = "  await page.getByRole('button', { name: 'Open dialog' }).click();\n"
          replacement = """  const clickPromise = page
            .getByRole('button', { name: 'Open dialog' })
            .click();
          """
          if text.count(click) != 1:
              raise SystemExit(f'dialog click marker count: {text.count(click)}')
          text = text.replace(click, replacement)
          dismiss = "  await dialog.dismiss();\n"
          if text.count(dismiss) != 1:
              raise SystemExit(f'dialog dismiss marker count: {text.count(dismiss)}')
          path.write_text(
              text.replace(dismiss, "  await dialog.dismiss();\n  await clickPromise;\n"),
              encoding='utf-8',
          )
          PY
          bunx biome check --write tests/dialog-lifecycle.spec.ts tests/upstream-runtime.spec.ts
          set +e
          bunx playwright test \
            tests/upstream-runtime.spec.ts tests/dialog-lifecycle.spec.ts \
            tests/upstream-config.spec.ts tests/network-origin-filter.spec.ts \
            tests/partial-snapshot-css.spec.ts \
            --project=chromium --workers=1 > /tmp/pr31-red.log 2>&1
          red=$?
          set -e
          cat /tmp/pr31-red.log
          test "$red" -ne 0

      - name: Apply implementation and compatibility corrections
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view playwright@next version)"
          case "$version" in
            1.63.0-alpha-*) ;;
            *) echo "Unexpected playwright@next version: $version" >&2; exit 1 ;;
          esac
          PLAYWRIGHT_VERSION="$version" python3 scripts/apply-pr31-final.py implementation
          python3 - <<'PY'
          from pathlib import Path

          def load(path: str) -> tuple[Path, str]:
              target = Path(path)
              return target, target.read_text(encoding='utf-8')

          path, text = load('utils/update-readme.js')
          old = """updateReadme().catch(() => {
            // Update readme failed - exit with error code
            process.exit(1);
          });
          """
          new = """updateReadme().then(
            () => process.exit(0),
            () => process.exit(1)
          );
          """
          if text.count(old) != 1:
              raise SystemExit('README completion marker mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path, text = load('src/tools/utils.ts')
          marker = "): Promise<R> {\n  const requests = new Set<playwright.Request>();"
          insertion = "): Promise<R> {\n  const settleTimeout =\n    tab.context.config.timeouts?.settle ?? TIMEOUTS.WAIT_FOR_COMPLETION;\n  const requests = new Set<playwright.Request>();"
          if text.count(marker) != 1:
              raise SystemExit('settle insertion marker mismatch')
          text = text.replace(marker, insertion)
          if text.count('tab.context.config.timeouts.settle') != 2:
              raise SystemExit('settle access count mismatch')
          path.write_text(
              text.replace('tab.context.config.timeouts.settle', 'settleTimeout'),
              encoding='utf-8',
          )

          path, text = load('src/tab.ts')
          navigation = 'this.context.config.timeouts.navigation'
          if text.count(navigation) != 2:
              raise SystemExit('navigation access count mismatch')
          path.write_text(
              text.replace(navigation, '(this.context.config.timeouts?.navigation ?? 60_000)'),
              encoding='utf-8',
          )

          path, text = load('src/context.ts')
          class_marker = 'export class InputRecorder {'
          helper = """function resolveRecorderAction(
            data: actions.ActionInContext | actions.Action | undefined
          ): actions.Action | undefined {
            if (!data) {
              return;
            }
            return 'action' in data ? data.action : data;
          }

          export class InputRecorder {"""
          if text.count(class_marker) != 1:
              raise SystemExit('InputRecorder marker mismatch')
          text = text.replace(class_marker, helper)
          text = text.replace(
              'data: actions.ActionInContext,',
              'data: actions.ActionInContext | actions.Action,',
          )
          added = """          const tab = Tab.forPage(page);
                    tab?.context.sessionLog?.logUserAction(data.action, tab, code, false);"""
          added_new = """          const tab = Tab.forPage(page);
                    const action = resolveRecorderAction(data);
                    if (tab && action) {
                      tab.context.sessionLog?.logUserAction(action, tab, code, false);
                    }"""
          if text.count(added) != 1:
              raise SystemExit('actionAdded marker mismatch')
          text = text.replace(added, added_new)
          updated = """          const tab = Tab.forPage(page);
                    if (tab) {
                      sessionLog.logUserAction(data.action, tab, code, true);
                    }"""
          updated_new = """          const tab = Tab.forPage(page);
                    const action = resolveRecorderAction(data);
                    if (tab && action) {
                      sessionLog.logUserAction(action, tab, code, true);
                    }"""
          if text.count(updated) != 1:
              raise SystemExit('actionUpdated marker mismatch')
          path.write_text(text.replace(updated, updated_new), encoding='utf-8')

          path, text = load('src/session-log.ts')
          import_line = "import { SecretRedactor } from './utils/secret-redactor.js';"
          if "import { logUnhandledError } from './utils/log.js';" not in text:
              if text.count(import_line) != 1:
                  raise SystemExit('session-log import marker mismatch')
              text = text.replace(
                  import_line,
                  "import { logUnhandledError } from './utils/log.js';\n" + import_line,
              )
          original_action = '    action: actions.Action,\n'
          optional_action = '    action: actions.Action | undefined,\n'
          if original_action in text:
              text = text.replace(original_action, optional_action, 1)
          elif optional_action not in text:
              raise SystemExit('session-log action parameter not found')
          original_code = '    code: string,\n'
          optional_code = '    code: string | undefined,\n'
          if original_code in text:
              text = text.replace(original_code, optional_code, 1)
          elif optional_code not in text:
              raise SystemExit('session-log code parameter not found')
          original_trim = '    const trimmedCode = code.trim();'
          optional_trim = "    const trimmedCode = code?.trim() ?? '';"
          guard = """    if (!action) {
              return;
            }
          """
          if original_trim in text:
              text = text.replace(original_trim, guard + optional_trim, 1)
          elif optional_trim in text:
              before = text[: text.index(optional_trim)]
              if 'if (!action)' not in before[-160:]:
                  text = text.replace(optional_trim, guard + optional_trim, 1)
          else:
              raise SystemExit('session-log trim marker not found')
          queue = '    this._sessionFileQueue = this._sessionFileQueue.then(operation);'
          recovered_queue = (
              '    this._sessionFileQueue = this._sessionFileQueue\n'
              '      .then(operation)\n'
              '      .catch(logUnhandledError);'
          )
          if queue in text:
              text = text.replace(queue, recovered_queue, 1)
          elif recovered_queue not in text:
              raise SystemExit('session-log queue marker not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install, format, and verify source
        shell: bash
        run: |
          set -euo pipefail
          bun install
          bunx playwright install --with-deps chromium
          rm -rf scripts/__pycache__
          timeout 5m bun run lint-fix
          bun run check:encoding
          timeout 10m bun run typecheck
          timeout 10m bun run build:publish
          timeout 2m bun run update-readme
          timeout 5m bun run lint-fix
          bun run check:encoding
          timeout 10m bun run typecheck
          timeout 10m bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check
          git diff --check

      - name: GREEN - focused regressions
        shell: bash
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        run: |
          set -euo pipefail
          bunx playwright test \
            tests/upstream-runtime.spec.ts tests/upstream-config.spec.ts \
            tests/http-allowed-hosts.spec.ts tests/mcp-server-initialize.spec.ts \
            tests/network-origin-filter.spec.ts tests/output-manager.spec.ts \
            tests/partial-snapshot-css.spec.ts tests/dialog-lifecycle.spec.ts \
            tests/navigation-context.spec.ts tests/readme-contract.spec.ts \
            tests/secret-redaction.spec.ts tests/session-log-redaction.spec.ts \
            tests/session-log.spec.ts tests/tool-gateways.spec.ts \
            tests/upstream-check.spec.ts \
            --project=chromium --workers=1

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report scripts/__pycache__
          rm -rf extension/dist extension/test-results extension/playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows
          git reset -- scripts/apply-pr31-final.py scripts/apply-pr31-final.py.gz.b64 \
            scripts/apply-pr31-final.py.gz.b64.* scripts/materialize-pr31-final.sh
          if git diff --cached --quiet; then
            echo 'No source changes were produced.' >&2
            exit 1
          fi
          git commit -m 'fix: address PR review and refresh Playwright upstream'
          git push origin HEAD:agent/pr31-final-review

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6
        with:
          name: finalize-pr31-source-failure
          path: |
            /tmp/pr31-red.log
            test-results/**/error-context.md
            playwright-report/**
          if-no-files-found: warn
          retention-days: 3
