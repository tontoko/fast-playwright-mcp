name: Materialize PR 31 final-review payload

on:
  push:
    branches:
      - agent/pr31-final-review
    paths:
      - '.github/workflows/repair-pr31-final-workflow.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-final-review
          fetch-depth: 0
      - name: Reconstruct and verify the payload
        shell: bash
        run: |
          set -euo pipefail
          target='scripts/apply-pr31-final.py.gz.b64'
          cat scripts/apply-pr31-final.py.gz.b64.[0-9][0-9] > "$target"
          printf '%s  %s\n' \
            '6248edd96a856f8a59b05b8ac5cc8294ff3d8219eb13c20b2a4d23e6858b0022' \
            "$target" | sha256sum --check
          base64 --decode "$target" | gzip --decompress \
            > /tmp/apply-pr31-final.py
          printf '%s  %s\n' \
            '6a95d924a4d0051c3db738f1e126776a51f3ab8185231cc24c49a7d7fa3a0d0d' \
            /tmp/apply-pr31-final.py | sha256sum --check
          python3 -m py_compile /tmp/apply-pr31-final.py
          git diff --check
      - name: Commit the verified payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-pr31-final.py.gz.b64
          git commit -m 'ci: materialize verified PR 31 payload'
          git push origin HEAD:agent/pr31-final-review
