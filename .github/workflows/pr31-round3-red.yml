name: PR 31 round 3 RED

on:
  push:
    branches:
      - agent/pr31-review-round3
    paths:
      - '.github/workflows/pr31-round3-red.yml'
      - 'tests/context-setup-cleanup.spec.ts'
      - 'tests/upstream-check.spec.ts'

permissions:
  contents: write

jobs:
  red:
    if: ${{ !contains(github.event.head_commit.message, '[round3-red]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-review-round3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Observe both regressions
        shell: bash
        run: |
          set -u
          : > ROUND3_RED.md
          unexpected=0
          for file in tests/context-setup-cleanup.spec.ts tests/upstream-check.spec.ts
          do
            set +e
            bunx playwright test "$file" --project=chromium --workers=1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              printf -- '- %s: unexpectedly passed\n' "$file" >> ROUND3_RED.md
              unexpected=$((unexpected + 1))
            else
              printf -- '- %s: failed as expected (exit %s)\n' "$file" "$status" >> ROUND3_RED.md
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROUND3_RED.md
          git commit -m 'test: record round 3 RED evidence [round3-red]'
          git push origin HEAD:agent/pr31-review-round3
          test "$unexpected" -eq 0
