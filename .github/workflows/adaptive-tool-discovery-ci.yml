name: Adaptive tool discovery CI

on:
  pull_request:
    branches:
      - fix/all-open-issues
    paths:
      - '.github/workflows/adaptive-tool-discovery-ci.yml'
      - 'config.d.ts'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'README.md'
      - 'utils/update-readme.js'

permissions:
  contents: read

concurrency:
  group: adaptive-tool-discovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build:publish
      - name: Run foundation tests
        run: |
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            --project=chromium
      - name: Lint
        run: bun run lint
