name: Link custom-browser documentation

on:
  push:
    branches: [fix/all-open-issues]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'tontoko/fast-playwright-mcp' && github.ref == 'refs/heads/fix/all-open-issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-open-issues
      - name: Add documentation link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          source = path.read_text()
          old = '''<!--- End of options generated section -->

          ### User profile'''
          new = '''<!--- End of options generated section -->

          For third-party browser binaries, compatibility guidance, and a Firefox example, see [Custom browser executables](./CUSTOM_BROWSER_EXECUTABLES.md).

          ### User profile'''
          if new in source:
              print('README link already present')
              raise SystemExit(0)
          if old not in source:
              raise SystemExit('README insertion point not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit README change
        run: |
          if git diff --quiet; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: link custom browser executable guide"
          git push origin HEAD:fix/all-open-issues
