name: PR 31 cross-platform verification

on:
  push:
    branches:
      - agent/pr31-final-fixes
    paths:
      - '.github/workflows/pr31-cross-platform-verification.yml'

permissions:
  contents: read

concurrency:
  group: pr31-cross-platform-verification
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, msedge, firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 38051caea9efd989a340c7f835198cd02aad7bf6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium ${{ matrix.project }}
      - run: bun run build:publish
      - run: bunx playwright test --project=${{ matrix.project }} --workers=1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 38051caea9efd989a340c7f835198cd02aad7bf6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          tags: fast-playwright-mcp-pr31:latest
          load: true
      - run: docker run --rm fast-playwright-mcp-pr31:latest --version
