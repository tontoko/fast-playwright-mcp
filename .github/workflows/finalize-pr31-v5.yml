name: Finalize pull request 31 v5

on:
  pull_request:
    branches: [main, fix/all-open-issues]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pull-request-31-v5
  cancel-in-progress: false

jobs:
  finalize:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 31) && (github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-tool-discovery')
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      BUNDLE_URL: https://filebin.net/fp-oai-final-v4-349f4e8db2374ec1819fa7adc51a19ce/fast-playwright-complete-v4.tar.gz
      CHECKSUM_URL: https://filebin.net/fp-oai-final-v4-349f4e8db2374ec1819fa7adc51a19ce/fast-playwright-complete-v4.sha256
      FAILURE_BASE: https://filebin.net/fp-oai-pr31-failure-6fdc2179dc9d41ddb08ff1b3a9ffef7d
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Initialize diagnostics
        run: mkdir -p /tmp/finalize-logs

      - name: Download verified source
        shell: bash
        run: |
          set -o pipefail
          echo download > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            curl --fail --location --retry 10 --retry-all-errors "$BUNDLE_URL" -o /tmp/source.tar.gz
            curl --fail --location --retry 10 --retry-all-errors "$CHECKSUM_URL" -o /tmp/source.sha256
            expected=$(awk '{print $1}' /tmp/source.sha256)
            actual=$(sha256sum /tmp/source.tar.gz | awk '{print $1}')
            test -n "$expected"
            test "$expected" = "$actual"
          } 2>&1 | tee /tmp/finalize-logs/download.log

      - name: Replace worktree
        shell: bash
        run: |
          set -o pipefail
          echo replace > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            tar -xzf /tmp/source.tar.gz -C .
            rm -f .github/workflows/apply-complete-bundle*.yml
            rm -f .github/workflows/finalize-pr31*.yml
            rm -f .github/workflows/adaptive-tool-discovery-ci.yml
            rm -f .github/workflows/implementation-sync.yml
            rm -f .github/workflows/export-source.yml
            rm -f .github/workflows/export-development-environment.yml
            rm -rf docs/superpowers tmp
          } 2>&1 | tee /tmp/finalize-logs/replace.log

      - name: Validate repository policy
        shell: bash
        run: |
          set -o pipefail
          echo policy > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            if grep -RIE 'issues:[[:space:]]*write|gh[[:space:]]+issue|gh[[:space:]]+pr[[:space:]]+(close|merge)' .github/workflows --include='*.yml' --include='*.yaml'; then
              exit 1
            fi
            while IFS= read -r line; do
              ref=${line#*@}; ref=${ref%% *}
              [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Unpinned action: $line" >&2; exit 1; }
            done < <(grep -RhE '^[[:space:]]*-[[:space:]]+uses:' .github/workflows)
          } 2>&1 | tee /tmp/finalize-logs/policy.log

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          echo install > /tmp/finalize-logs/stage
          bun install --frozen-lockfile 2>&1 | tee /tmp/finalize-logs/install.log

      - name: Static validation
        shell: bash
        run: |
          set -o pipefail
          echo static > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            cp src/apps/generated/dashboard.ts /tmp/dashboard.ts
            bun run build:dashboard
            cmp /tmp/dashboard.ts src/apps/generated/dashboard.ts
            bun run typecheck
            bun run build:publish
            bun run lint
            bun run benchmark:tools -- --check
            bun run upstream:check:fixture > /tmp/upstream-a.md
            bun run upstream:check:fixture > /tmp/upstream-b.md
            diff -u /tmp/upstream-a.md /tmp/upstream-b.md
          } 2>&1 | tee /tmp/finalize-logs/static.log

      - name: Focused contract tests
        shell: bash
        run: |
          set -o pipefail
          echo focused-tests > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            bunx playwright install --with-deps chromium
            bunx playwright test \
              tests/adaptive-config.spec.ts \
              tests/mcp-tool-schema.spec.ts \
              tests/tool-registry.spec.ts \
              tests/tool-visibility.spec.ts \
              tests/tool-search.spec.ts \
              tests/tool-gateways.spec.ts \
              tests/browser-find.spec.ts \
              tests/http-allowed-hosts.spec.ts \
              tests/output-manager.spec.ts \
              tests/secret-redaction.spec.ts \
              tests/mcp-resources.spec.ts \
              tests/dashboard-build.spec.ts \
              tests/dashboard-render.spec.ts \
              tests/dashboard-e2e.spec.ts \
              --project=chromium
            bun run test:package
          } 2>&1 | tee /tmp/finalize-logs/focused-tests.log

      - name: Push clean source
        shell: bash
        run: |
          set -o pipefail
          echo push > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            rm -rf lib test-results playwright-report
            rm -f *.tgz
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'feat: complete adaptive MCP platform improvements'
              git push origin HEAD:agent/adaptive-tool-discovery
            fi
          } 2>&1 | tee /tmp/finalize-logs/push.log

      - name: Full browser matrix
        shell: bash
        run: |
          set -o pipefail
          echo browser-matrix > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            bunx playwright install --with-deps chromium chrome msedge firefox webkit
            retry() { "$@" || "$@"; }
            retry bunx playwright test --project=chrome
            retry bunx playwright test --project=chromium
            retry bunx playwright test --project=msedge
            retry bunx playwright test --project=firefox
            retry bunx playwright test --project=webkit
          } 2>&1 | tee /tmp/finalize-logs/browser-matrix.log

      - name: Extension validation
        shell: bash
        run: |
          set -o pipefail
          echo extension > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            npm ci --prefix extension
            npm run build --prefix extension
            xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts || \
              xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts
          } 2>&1 | tee /tmp/finalize-logs/extension.log

      - name: Docker validation
        shell: bash
        run: |
          set -o pipefail
          echo docker > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            docker build -t fast-playwright-mcp-complete:ci .
            docker run --rm fast-playwright-mcp-complete:ci --version
          } 2>&1 | tee /tmp/finalize-logs/docker.log

      - name: Update only pull request 31 and mark ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          echo ready > /tmp/finalize-logs/stage
          {
            set -euo pipefail
            cat > /tmp/body.md <<'EOF'
            ## Summary

            This pull request consolidates the repository maintenance and architecture work into one reviewed change set.

            It includes:

            - restored and hardened CI coverage with immutable GitHub Action references
            - an adaptive MCP tool catalog with `adaptive`, `minimal`, and `full` profiles
            - deterministic tool discovery and schema-validated read-only/action gateways
            - compact accessibility-snapshot search and enforced context budgets
            - selected Microsoft Playwright MCP compatibility and security improvements while retaining the local lint and formatting toolchain
            - read-only upstream compatibility reporting and source attribution
            - an offline, opt-in MCP Apps dashboard with CSP and XSS-focused tests
            - package-install, browser, extension, Docker, and protocol conformance coverage

            The default adaptive catalog exposes seven tools and keeps the serialized startup list below the enforced 12,000-byte budget. Existing static behavior remains available with `--tool-profile=full`.

            This pull request does not edit, close, label, or comment on repository issues or other contributors' pull requests.

            ## Validation

            - typecheck, production build, lint, and generated-file cleanliness
            - context-budget and upstream-report determinism checks
            - Chromium contract and security suites
            - Chrome, Chromium, Microsoft Edge, Firefox, and WebKit suites
            - packed npm artifact installation and MCP startup
            - browser extension build and E2E
            - Docker build and CLI smoke test
            EOF
            gh pr edit 31 --repo "$GITHUB_REPOSITORY" --base main --title 'feat: improve tool discovery, upstream compatibility, and MCP Apps support' --body-file /tmp/body.md
            gh pr ready 31 --repo "$GITHUB_REPOSITORY"
          } 2>&1 | tee /tmp/finalize-logs/ready.log

      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          tar -czf /tmp/pr31-failure.tar.gz -C /tmp finalize-logs
          curl --fail -X POST --data-binary @/tmp/pr31-failure.tar.gz "$FAILURE_BASE/pr31-failure.tar.gz"
          curl --fail -X POST --data-binary @/tmp/finalize-logs/stage "$FAILURE_BASE/stage.txt"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr31-finalization-failure
          path: /tmp/finalize-logs
          if-no-files-found: warn
          retention-days: 7
