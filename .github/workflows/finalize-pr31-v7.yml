name: Finalize pull request 31 v7

on:
  pull_request:
    branches: [main, fix/all-open-issues]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: finalize-pull-request-31-v7
  cancel-in-progress: false

jobs:
  finalize:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 31) && (github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-tool-discovery')
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      BUNDLE_URL: https://filebin.net/fp-oai-complete-v7-6c3e38442abd45f9b37dbacdbfd6816d/fast-playwright-complete-v7.tar.gz
      CHECKSUM_URL: https://filebin.net/fp-oai-complete-v7-6c3e38442abd45f9b37dbacdbfd6816d/fast-playwright-complete-v7.sha256
      FAILURE_BASE: https://filebin.net/fp-oai-pr31-v7-failure-1623391e4d604435bbd578292becaa70
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Initialize diagnostics
        run: mkdir -p /tmp/pr31-finalize-logs

      - name: Wait for and verify locally reviewed source bundle
        shell: bash
        run: |
          set -o pipefail
          echo bundle > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            downloaded=false
            for attempt in $(seq 1 80); do
              if curl --fail --location --silent --show-error "$BUNDLE_URL" -o /tmp/source.tar.gz && \
                 curl --fail --location --silent --show-error "$CHECKSUM_URL" -o /tmp/source.sha256; then
                downloaded=true
                break
              fi
              sleep 30
            done
            test "$downloaded" = true
            expected=$(awk '{print $1}' /tmp/source.sha256)
            actual=$(sha256sum /tmp/source.tar.gz | awk '{print $1}')
            test -n "$expected"
            test "$expected" = "$actual"
          } 2>&1 | tee /tmp/pr31-finalize-logs/bundle.log

      - name: Replace worktree and remove development-only automation
        shell: bash
        run: |
          set -o pipefail
          echo replace > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            tar -xzf /tmp/source.tar.gz -C .
            rm -f .github/workflows/apply-complete-bundle*.yml
            rm -f .github/workflows/finalize-pr31*.yml
            rm -f .github/workflows/adaptive-tool-discovery-ci.yml
            rm -f .github/workflows/implementation-sync.yml
            rm -f .github/workflows/export-source.yml
            rm -f .github/workflows/export-development-environment.yml
            rm -rf docs/superpowers tmp
          } 2>&1 | tee /tmp/pr31-finalize-logs/replace.log

      - name: Enforce repository ownership boundary and workflow integrity
        shell: bash
        run: |
          set -o pipefail
          echo policy > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            if grep -RIE 'issues:[[:space:]]*write|gh[[:space:]]+issue|gh[[:space:]]+pr[[:space:]]+(close|merge)' .github/workflows --include='*.yml' --include='*.yaml'; then
              echo 'Unexpected issue or other pull-request mutation found.' >&2
              exit 1
            fi
            while IFS= read -r line; do
              ref=${line#*@}
              ref=${ref%% *}
              [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
                echo "Action is not pinned to a full commit SHA: $line" >&2
                exit 1
              }
            done < <(grep -RhE '^[[:space:]]*-[[:space:]]+uses:' .github/workflows)
          } 2>&1 | tee /tmp/pr31-finalize-logs/policy.log

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          echo install > /tmp/pr31-finalize-logs/stage
          bun install --frozen-lockfile 2>&1 | tee /tmp/pr31-finalize-logs/install.log

      - name: Run static, generated, and budget validation
        shell: bash
        run: |
          set -o pipefail
          echo static > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            cp src/apps/generated/dashboard.ts /tmp/dashboard-before.ts
            bun run build:dashboard
            cmp /tmp/dashboard-before.ts src/apps/generated/dashboard.ts
            bun run typecheck
            bun run build:publish
            bun run lint
            bun run benchmark:tools -- --check
            bun run upstream:check:fixture > /tmp/upstream-a.md
            bun run upstream:check:fixture > /tmp/upstream-b.md
            diff -u /tmp/upstream-a.md /tmp/upstream-b.md
          } 2>&1 | tee /tmp/pr31-finalize-logs/static.log

      - name: Run focused protocol, security, and dashboard tests
        shell: bash
        run: |
          set -o pipefail
          echo focused-tests > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            bunx playwright install --with-deps chromium
            bunx playwright test \
              tests/adaptive-config.spec.ts \
              tests/mcp-tool-schema.spec.ts \
              tests/tool-registry.spec.ts \
              tests/tool-visibility.spec.ts \
              tests/tool-search.spec.ts \
              tests/tool-gateways.spec.ts \
              tests/browser-find.spec.ts \
              tests/http-allowed-hosts.spec.ts \
              tests/output-manager.spec.ts \
              tests/secret-redaction.spec.ts \
              tests/mcp-resources.spec.ts \
              tests/dashboard-build.spec.ts \
              tests/dashboard-render.spec.ts \
              tests/dashboard-e2e.spec.ts \
              --project=chromium
            bun run test:package
          } 2>&1 | tee /tmp/pr31-finalize-logs/focused-tests.log

      - name: Commit and push clean validated source
        id: push
        shell: bash
        run: |
          set -o pipefail
          echo push > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            rm -rf lib test-results playwright-report
            rm -f *.tgz
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'feat: complete adaptive MCP platform improvements'
              git push origin HEAD:agent/adaptive-tool-discovery
            fi
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee /tmp/pr31-finalize-logs/push.log

      - name: Install complete browser matrix
        shell: bash
        run: |
          set -o pipefail
          echo browser-install > /tmp/pr31-finalize-logs/stage
          bunx playwright install --with-deps chromium chrome msedge firefox webkit 2>&1 | tee /tmp/pr31-finalize-logs/browser-install.log

      - name: Run all browser projects with one retry
        shell: bash
        run: |
          set -o pipefail
          echo browser-matrix > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            retry_project() {
              local project=$1
              bunx playwright test --project="$project" || bunx playwright test --project="$project"
            }
            retry_project chrome
            retry_project chromium
            retry_project msedge
            retry_project firefox
            retry_project webkit
          } 2>&1 | tee /tmp/pr31-finalize-logs/browser-matrix.log

      - name: Build and test browser extension
        shell: bash
        run: |
          set -o pipefail
          echo extension > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            npm ci --prefix extension
            npm run build --prefix extension
            xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts || \
              xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts
          } 2>&1 | tee /tmp/pr31-finalize-logs/extension.log

      - name: Build and smoke-test Docker image
        shell: bash
        run: |
          set -o pipefail
          echo docker > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            docker build --tag fast-playwright-mcp-complete:ci .
            docker run --rm fast-playwright-mcp-complete:ci --version
          } 2>&1 | tee /tmp/pr31-finalize-logs/docker.log

      - name: Wait for hosted checks on the pushed source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          echo hosted-checks > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            expected_sha='${{ steps.push.outputs.sha }}'
            for attempt in $(seq 1 60); do
              current_sha=$(gh pr view 31 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
              test "$current_sha" = "$expected_sha"
              count=$(gh pr checks 31 --repo "$GITHUB_REPOSITORY" --json name 2>/dev/null | jq length || echo 0)
              if [[ "$count" -gt 0 ]]; then
                break
              fi
              sleep 15
            done
            gh pr checks 31 --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          } 2>&1 | tee /tmp/pr31-finalize-logs/hosted-checks.log

      - name: Verify pull request 31 has no unresolved review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          echo review-threads > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            unresolved=$(gh api graphql \
              -f owner='${{ github.repository_owner }}' \
              -f name='${{ github.event.repository.name }}' \
              -F number=31 \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
            test "$unresolved" -eq 0
          } 2>&1 | tee /tmp/pr31-finalize-logs/review-threads.log

      - name: Update only pull request 31 and mark ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          echo ready > /tmp/pr31-finalize-logs/stage
          {
            set -euo pipefail
            cat > /tmp/pr-body.md <<'EOF'
            ## Summary

            This pull request consolidates the repository maintenance and architecture work into one reviewed change set.

            It includes:

            - restored and hardened CI coverage with immutable GitHub Action references
            - an adaptive MCP tool catalog with `adaptive`, `minimal`, and `full` profiles
            - deterministic tool discovery and schema-validated read-only/action gateways
            - compact accessibility-snapshot search and enforced context budgets
            - selected Microsoft Playwright MCP compatibility and security improvements while retaining the local lint and formatting toolchain
            - read-only upstream compatibility reporting and source attribution
            - an offline, opt-in MCP Apps dashboard with CSP and XSS-focused tests
            - package-install, browser, extension, Docker, and protocol conformance coverage

            The default adaptive catalog exposes seven tools and keeps the serialized startup list below the enforced 12,000-byte budget. Existing static behavior remains available with `--tool-profile=full`.

            This pull request does not edit, close, label, or comment on repository issues or other contributors' pull requests.

            ## Validation

            - typecheck, production build, lint, and generated-file cleanliness
            - context-budget and upstream-report determinism checks
            - Chromium contract and security suites
            - Chrome, Chromium, Microsoft Edge, Firefox, and WebKit suites
            - packed npm artifact installation and MCP startup
            - browser extension build and E2E
            - Docker build and CLI smoke test
            - hosted checks and unresolved-review-thread verification
            EOF
            gh pr edit 31 --repo "$GITHUB_REPOSITORY" --base main --title 'feat: improve tool discovery, upstream compatibility, and MCP Apps support' --body-file /tmp/pr-body.md
            gh pr ready 31 --repo "$GITHUB_REPOSITORY"
          } 2>&1 | tee /tmp/pr31-finalize-logs/ready.log

      - name: Publish failure diagnostics outside GitHub
        if: failure()
        shell: bash
        run: |
          set +e
          tar -czf /tmp/pr31-v7-failure.tar.gz -C /tmp pr31-finalize-logs
          curl --fail -X POST --data-binary @/tmp/pr31-v7-failure.tar.gz "$FAILURE_BASE/pr31-v7-failure.tar.gz"
          curl --fail -X POST --data-binary @/tmp/pr31-finalize-logs/stage "$FAILURE_BASE/stage.txt"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr31-finalization-v7-failure
          path: /tmp/pr31-finalize-logs
          if-no-files-found: warn
          retention-days: 7
