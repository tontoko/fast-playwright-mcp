name: PR 31 final fixes RED

on:
  push:
    branches: [agent/pr31-final-fixes]
    paths:
      - '.github/workflows/pr31-final-fixes-red.yml'
      - 'tests/cdp-relay-launch.spec.ts'
      - 'tests/cdp-relay-security.spec.ts'
      - 'tests/dashboard-refresh.spec.ts'
      - 'tests/session-log-eviction.spec.ts'
      - 'tests/screenshot-webp.spec.ts'
      - 'tests/upstream-dual-audit.spec.ts'
      - 'src/utils/codegen.ts'

permissions:
  contents: write

concurrency:
  group: pr31-final-fixes-red
  cancel-in-progress: true

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-final-fixes
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run each regression against the unfixed implementation
        shell: bash
        run: |
          set -u
          failures=0
          : > RED_RESULT.md
          printf '# PR 31 RED verification\n\n' >> RED_RESULT.md
          for file in \
            tests/cdp-relay-launch.spec.ts \
            tests/cdp-relay-security.spec.ts \
            tests/dashboard-refresh.spec.ts \
            tests/session-log-eviction.spec.ts \
            tests/screenshot-webp.spec.ts \
            tests/upstream-dual-audit.spec.ts
          do
            echo "=== RED: ${file} ==="
            set +e
            bunx playwright test "${file}" --project=chromium --workers=1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              printf -- '- %s: unexpectedly passed\n' "$file" >> RED_RESULT.md
              failures=$((failures + 1))
            else
              printf -- '- %s: failed as expected (exit %s)\n' "$file" "$status" >> RED_RESULT.md
            fi
          done
          printf '\n- unexpected passes: %s\n' "$failures" >> RED_RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RED_RESULT.md
          git commit -m 'test: record PR 31 RED evidence [skip ci]'
          git push origin HEAD:agent/pr31-final-fixes
          test "$failures" -eq 0
