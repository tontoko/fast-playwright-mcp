# run: round3-complete-2
name: PR 31 round 3 GREEN

on:
  push:
    branches:
      - agent/pr31-review-round3
    paths:
      - '.github/workflows/pr31-round3-green.yml'
      - 'src/context.ts'
      - 'src/network-origin.ts'
      - 'src/utils/codegen.ts'
      - 'scripts/upstream-check.ts'
      - 'tests/context-setup-cleanup.spec.ts'
      - 'tests/upstream-check.spec.ts'

permissions:
  contents: write

concurrency:
  group: pr31-round3-green
  cancel-in-progress: true

jobs:
  green:
    if: ${{ !contains(github.event.head_commit.message, '[round3-green]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-review-round3
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Apply lint-safe refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          context = Path('src/context.ts')
          text = context.read_text(encoding='utf-8')
          text = text.replace(
              'No open pages available. Use the "browser_navigate" tool first.',
              'No open pages available. Use the "browser_navigate" tool to navigate to a page first.',
          )
          context.write_text(text, encoding='utf-8')

          path = Path('scripts/upstream-check.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index('export function diffTreeEntries(')
          end = text.index('\nfunction sortedFiles(', start)
          replacement = """function treeEntriesMatch(
            before: GitTreeEntry | undefined,
            after: GitTreeEntry | undefined
          ): boolean {
            return Boolean(
              before &&
                after &&
                before.sha === after.sha &&
                before.mode === after.mode &&
                before.type === after.type
            );
          }

          function changedFileForPath(
            path: string,
            base: ReadonlyMap<string, GitTreeEntry>,
            head: ReadonlyMap<string, GitTreeEntry>,
            known: ReadonlyMap<string, ChangedFile>,
            renamedSources: ReadonlySet<string>
          ): ChangedFile | undefined {
            const before = base.get(path);
            const after = head.get(path);
            if (treeEntriesMatch(before, after)) {
              return;
            }
            if (before && !after && renamedSources.has(path)) {
              return;
            }
            const knownFile = known.get(path);
            if (knownFile) {
              return { ...knownFile };
            }
            return {
              filename: path,
              status: before ? (after ? 'modified' : 'removed') : 'added',
            };
          }

          export function diffTreeEntries(
            baseEntries: readonly GitTreeEntry[],
            headEntries: readonly GitTreeEntry[],
            compareFiles: readonly ChangedFile[] = []
          ): ChangedFile[] {
            const base = fileEntries(baseEntries);
            const head = fileEntries(headEntries);
            const known = new Map(
              compareFiles.map((file) => [file.filename, file] as const)
            );
            const renamedSources = new Set(
              compareFiles
                .filter(
                  (file) => file.status === 'renamed' && file.previous_filename
                )
                .map((file) => file.previous_filename as string)
            );
            const paths = [...new Set([...base.keys(), ...head.keys()])].sort(
              (left, right) => left.localeCompare(right)
            );
            const result = paths
              .map((path) =>
                changedFileForPath(path, base, head, known, renamedSources)
              )
              .filter((file): file is ChangedFile => Boolean(file));
            const resultPaths = new Set(result.map((file) => file.filename));

            for (const file of compareFiles) {
              if (!resultPaths.has(file.filename)) {
                result.push({ ...file });
              }
            }
            return result.sort((left, right) =>
              left.filename.localeCompare(right.filename)
            );
          }
          """
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'async function githubJson<T>(\n',
              'function githubJson<T>(\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Static verification
        run: |
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run lint
          git diff --check
      - name: Focused regressions
        run: |
          bunx playwright test \
            tests/context-setup-cleanup.spec.ts \
            tests/upstream-check.spec.ts \
            tests/upstream-dual-audit.spec.ts \
            tests/upstream-runtime.spec.ts \
            tests/network-origin-filter.spec.ts \
            tests/navigation-context.spec.ts \
            --project=chromium \
            --workers=1
      - name: Upstream fixture report
        run: |
          bun run upstream:check:fixture > /tmp/upstream-report.md
          grep -q 'File inventory:' /tmp/upstream-report.md
      - name: Full Chromium suite
        run: bunx playwright test --project=chromium --workers=2
      - name: Commit clean verified tree
        run: |
          printf '# PR 31 round 3 verification\n\n' > ROUND3_GREEN.md
          printf -- '- static verification: passed\n' >> ROUND3_GREEN.md
          printf -- '- focused regressions: passed\n' >> ROUND3_GREEN.md
          printf -- '- full Chromium suite: passed\n' >> ROUND3_GREEN.md
          rm -rf lib test-results playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git rm .github/workflows/pr31-round3-red.yml
          git rm .github/workflows/pr31-round3-green.yml
          git rm ROUND3_RED.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close failed contexts and complete upstream audits [round3-green]'
          git push origin HEAD:agent/pr31-review-round3
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6
        with:
          name: pr31-round3-failure
          path: |
            test-results/**/error-context.md
            playwright-report/**
          if-no-files-found: warn
          retention-days: 3
