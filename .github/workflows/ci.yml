name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build:publish
      - name: Run lint
        run: bun run lint
      - name: Ensure generated files are committed
        run: git diff --exit-code

  browser-tests:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, chromium, msedge, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install ${{ matrix.project }} and system dependencies
        run: bunx playwright install --with-deps ${{ matrix.project }}
      - name: Build package
        run: bun run build:publish
      - name: Run ${{ matrix.project }} tests
        run: bunx playwright test --project=${{ matrix.project }}

  extension:
    name: Browser extension build and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install package dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build:publish
      - name: Install extension dependencies
        run: npm ci --prefix extension
      - name: Build extension
        run: npm run build --prefix extension
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Run extension E2E tests
        run: xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts
      - name: Upload extension artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mcp-extension
          path: extension/dist
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: fast-playwright-mcp-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Run CLI smoke test
        run: docker run --rm fast-playwright-mcp-ci:latest --version
