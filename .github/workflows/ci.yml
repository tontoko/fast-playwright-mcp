name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-sonar-cleanup:
    name: Apply verified SonarQube cleanup
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/all-open-issues'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/all-open-issues
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add regression test and verify RED
        shell: bash
        run: |
          cat > tests/test-helpers-sonar.spec.ts <<'EOF'
          import { test } from '@playwright/test';
          import {
            expectFullSnapshotFallback,
            expectPartialSnapshotForSelector,
          } from './test-helpers.js';

          type PartialSnapshotResponse = Parameters<
            typeof expectPartialSnapshotForSelector
          >[0];

          function responseWithText(text: string): PartialSnapshotResponse {
            return {
              content: [{ type: 'text', text }],
            } as unknown as PartialSnapshotResponse;
          }

          test('asserts a selector-scoped partial snapshot', () => {
            expectPartialSnapshotForSelector(
              responseWithText('Capturing partial snapshot for selector: #app'),
              '#app'
            );
          });

          test('asserts fallback to a full snapshot', () => {
            expectFullSnapshotFallback(
              responseWithText('Falling back to full snapshot')
            );
          });
          EOF

          set +e
          bunx playwright test tests/test-helpers-sonar.spec.ts --project=chromium > /tmp/sonar-red.log 2>&1
          status=$?
          set -e
          cat /tmp/sonar-red.log
          if [[ "$status" -eq 0 ]]; then
            echo 'Expected the regression test to fail before the split helper API exists.'
            exit 1
          fi

      - name: Apply SonarQube fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(
              path: str,
              old: str,
              new: str,
              expected_count: int = 1,
          ) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f'{path}: expected {expected_count} occurrence(s), found {count}: {old!r}'
                  )
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'extension/src/relay-connection.ts',
              '        params: { ...(params ?? {}) },',
              '        params: { ...params },',
          )

          replace_exact(
              'src/extension/cdp-relay.ts',
              'type CDPParams = Record<string, unknown> | undefined;',
              'type CDPParams = Record<string, unknown>;',
          )
          replace_exact(
              'src/extension/cdp-relay.ts',
              '          params: params.params as CDPParams,',
              '          params: params.params as CDPParams | undefined,',
          )
          replace_exact(
              'src/extension/cdp-relay.ts',
              '    params: CDPParams,\n    sessionId: string | undefined\n  ): Promise<unknown> {',
              '    params: CDPParams | undefined,\n    sessionId: string | undefined\n  ): Promise<unknown> {',
              expected_count=2,
          )

          replace_exact(
              'tests/test-helpers.ts',
              '  private originalMethods: Map<ConsoleMethod, (...args: unknown[]) => void> =\n    new Map();',
              '  private readonly originalMethods: Map<\n    ConsoleMethod,\n    (...args: unknown[]) => void\n  > = new Map();',
          )
          replace_exact(
              'tests/test-helpers.ts',
              '  private capturedMessages: Array<{ level: ConsoleMethod; args: unknown[] }> =\n    [];',
              '  private readonly capturedMessages: Array<{\n    level: ConsoleMethod;\n    args: unknown[];\n  }> = [];',
          )
          replace_exact(
              'tests/test-helpers.ts',
              '  private consoleCapture: ConsoleCapture = new ConsoleCapture();',
              '  private readonly consoleCapture: ConsoleCapture = new ConsoleCapture();',
              expected_count=2,
          )
          replace_exact(
              'tests/test-helpers.ts',
              "  const countMatches = (pattern: RegExp) =>\n    lines.filter((line) => line.match(pattern)).length;",
              "  const countMatches = (pattern: RegExp) =>\n    lines.filter((line) => {\n      pattern.lastIndex = 0;\n      return pattern.exec(line) !== null;\n    }).length;",
          )

          old_helper = '''export function expectPartialSnapshotBehavior(
            result: CallToolResponse,
            selectorUsed: string,
            shouldContainSelector = true
          ): void {
            if (shouldContainSelector) {
              expect(result.content[0].text).toContain(
                `Capturing partial snapshot for selector: ${selectorUsed}`
              );
            } else {
              expect(result.content[0].text).toContain('Falling back to full snapshot');
            }
          }'''
          new_helpers = '''export function expectPartialSnapshotForSelector(
            result: CallToolResponse,
            selectorUsed: string
          ): void {
            expect(result.content[0].text).toContain(
              `Capturing partial snapshot for selector: ${selectorUsed}`
            );
          }

          /**
           * Helper function for full snapshot fallback tests
           */
          export function expectFullSnapshotFallback(
            result: CallToolResponse
          ): void {
            expect(result.content[0].text).toContain('Falling back to full snapshot');
          }'''
          replace_exact('tests/test-helpers.ts', old_helper, new_helpers)
          PY

      - name: Verify GREEN
        run: bunx playwright test tests/test-helpers-sonar.spec.ts --project=chromium

      - name: Build package
        run: bun run build:publish

      - name: Build extension
        run: |
          npm ci --prefix extension
          npm run build --prefix extension

      - name: Run lint
        run: bun run lint

      - name: Commit cleanup
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            extension/src/relay-connection.ts \
            src/extension/cdp-relay.ts \
            tests/test-helpers.ts \
            tests/test-helpers-sonar.spec.ts
          git commit -m 'chore: resolve SonarQube code smells'
          git push origin HEAD:fix/all-open-issues

  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build:publish
      - name: Run lint
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint.log
      - name: Upload lint failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-failure-log
          path: lint.log
          if-no-files-found: error
          retention-days: 7
      - name: Ensure generated files are committed
        run: git diff --exit-code

  browser-tests:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, chromium, msedge, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install test browsers and system dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.project }}" == "chromium" ]]; then
            bunx playwright install --with-deps chromium
          else
            bunx playwright install --with-deps chromium "${{ matrix.project }}"
          fi
      - name: Build package
        run: bun run build:publish
      - name: Run ${{ matrix.project }} tests
        run: |
          set -o pipefail
          bunx playwright test --project=${{ matrix.project }} 2>&1 | tee browser-${{ matrix.project }}.log
      - name: Upload ${{ matrix.project }} failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.project }}-failure-diagnostics
          path: |
            browser-${{ matrix.project }}.log
            test-results
          if-no-files-found: warn
          retention-days: 7

  extension:
    name: Browser extension build and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install package dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build:publish
      - name: Install extension dependencies
        run: npm ci --prefix extension
      - name: Build extension
        run: |
          set -o pipefail
          npm run build --prefix extension 2>&1 | tee extension-build.log
      - name: Upload extension build failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-build-failure-log
          path: extension-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Run extension E2E tests
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        run: |
          set -o pipefail
          xvfb-run --auto-servernum bunx playwright test --config=extension/playwright.config.ts 2>&1 | tee extension-e2e.log
      - name: Upload extension E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-e2e-failure-diagnostics
          path: |
            extension-e2e.log
            test-results
          if-no-files-found: warn
          retention-days: 7
      - name: Upload extension artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-mcp-extension
          path: extension/dist
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          tags: fast-playwright-mcp-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Run CLI smoke test
        run: |
          set -o pipefail
          docker run --rm fast-playwright-mcp-ci:latest --version 2>&1 | tee docker-smoke.log
      - name: Upload Docker smoke-test failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-smoke-failure-log
          path: docker-smoke.log
          if-no-files-found: error
          retention-days: 7
