name: Implementation sync

on:
  pull_request:
    branches:
      - fix/all-open-issues
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install and refresh lockfile
        run: bun install
      - name: Generate dashboard
        run: bun run build:dashboard
      - name: Format changed sources
        run: bun run lint-fix
      - name: Build package
        run: bun run build:publish
      - name: Run foundation tests
        run: |
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            --project=chromium
      - name: Run lint
        run: bun run lint
      - name: Commit generated and formatted files
        shell: bash
        run: |
          git diff --check
          if [[ -z "$(git status --short)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: refresh generated and formatted files'
          git push origin HEAD:agent/adaptive-tool-discovery
