name: Apply CI and SonarQube fixes v5

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-ci-sonar-fixes-v5.yml'

permissions:
  contents: write

concurrency:
  group: apply-ci-sonar-fixes-v5-pr31
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-ci-sonar-fixes-v3.yml').read_text(encoding='utf-8')
          step = workflow.index('      - name: Apply reviewed source fixes\n')
          start_marker = '        run: |\n'
          start = workflow.index(start_marker, step) + len(start_marker)
          end = workflow.index('\n      - name: Install dependencies and Chromium', start)
          Path('/tmp/apply-v3.sh').write_text(textwrap.dedent(workflow[start:end]), encoding='utf-8')
          PY
          bash /tmp/apply-v3.sh
          cat > src/tools/evaluate.ts <<'EOF'
          import type * as playwright from 'playwright';
          import { z } from 'zod';
          import { expectationSchema } from '../schemas/expectation.js';
          import {
            type ElementSelector,
            elementSelectorSchema,
            isCSSSelector,
            isRefSelector,
            isRoleSelector,
            isTextSelector,
          } from '../types/selectors.js';
          import { quote } from '../utils/codegen.js';
          import { defineTabTool } from './tool.js';
          import { generateLocator } from './utils.js';

          function selectorCode(selector: ElementSelector): string | undefined {
            if (isCSSSelector(selector)) return `locator(${quote(selector.css)})`;
            if (isRoleSelector(selector)) {
              const options = selector.text ? `, { name: ${quote(selector.text)} }` : '';
              return `getByRole(${quote(selector.role)}${options})`;
            }
            if (isTextSelector(selector)) {
              const textLocator = `getByText(${quote(selector.text)})`;
              return selector.tag ? `locator(${quote(selector.tag)}).${textLocator}` : textLocator;
            }
            if (isRefSelector(selector)) return;
            return;
          }

          async function refSelectorCode(
            tab: Parameters<Parameters<typeof defineTabTool>[0]['handle']>[0],
            locator: playwright.Locator
          ): Promise<string | undefined> {
            const text = (await locator.textContent().catch(() => null))
              ?.replace(/\s+/gu, ' ')
              .trim();
            if (!(text && text.length <= 200)) return;
            return (await tab.page.getByText(text).count()) === 1
              ? `getByText(${quote(text)})`
              : undefined;
          }

          const selectorsSchema = z.array(elementSelectorSchema).min(1).max(5).describe(
            'Array of element selectors (max 5) supporting ref, role, CSS, or text-based selection'
          );
          const evaluateSchema = z.object({
            function: z.string().describe('JS function: () => {...} or (element) => {...}'),
            selectors: selectorsSchema.optional().describe(
              'Optional element selectors. If provided, function receives element as parameter'
            ),
            expectation: expectationSchema.describe(
              'Page state config. false for data extraction, true for DOM changes'
            ),
          });
          const evaluate = defineTabTool({
            capability: 'core',
            schema: {
              name: 'browser_evaluate',
              title: 'Evaluate JavaScript',
              description: 'Evaluate JavaScript expression on page or element and return result',
              inputSchema: evaluateSchema,
              type: 'action',
            },
            handle: async (tab, params, response) => {
              let locator: playwright.Locator | undefined;
              let generatedLocator: string | undefined;
              if (params.selectors && params.selectors.length > 0) {
                const resolutionResults = await tab.resolveElementLocators(params.selectors);
                const successfulResults = resolutionResults.filter(
                  (result) => result.locator && !result.error
                );
                if (successfulResults.length === 0) {
                  const errors = resolutionResults
                    .map((result) => result.error || 'Unknown error')
                    .join(', ');
                  throw new Error(`Failed to resolve element selectors: ${errors}`);
                }
                const selected = successfulResults[0];
                locator = selected.locator;
                generatedLocator =
                  selectorCode(selected.selector) ??
                  (await refSelectorCode(tab, locator)) ??
                  (await generateLocator(locator));
              }
              await tab.waitForCompletion(async () => {
                try {
                  const expression = params.function;
                  const evalResult = locator
                    ? await locator.evaluate(async (element, source) => {
                        // biome-ignore lint/security/noGlobalEval: evaluating explicit user-provided browser tool input is this tool's purpose.
                        const value = eval(`(${source})`);
                        const isFunction = typeof value === 'function';
                        const result = await (isFunction ? value(element) : value);
                        return { result, isFunction };
                      }, expression)
                    : await tab.page.evaluate(async (source) => {
                        // biome-ignore lint/security/noGlobalEval: evaluating explicit user-provided browser tool input is this tool's purpose.
                        const value = eval(`(${source})`);
                        const isFunction = typeof value === 'function';
                        const result = await (isFunction ? value() : value);
                        return { result, isFunction };
                      }, expression);
                  const codeExpression = evalResult.isFunction
                    ? expression
                    : `() => (${expression})`;
                  response.addCode(
                    locator
                      ? `await page.${generatedLocator}.evaluate(${quote(codeExpression)});`
                      : `await page.evaluate(${quote(codeExpression)});`
                  );
                  response.addResult(JSON.stringify(evalResult.result, null, 2) ?? 'undefined');
                } catch (error) {
                  response.addError(
                    `JavaScript evaluation failed: ${error instanceof Error ? error.message : String(error)}`
                  );
                }
              });
            },
          });
          export default [evaluate];
          EOF

      - name: Install and verify
        shell: bash
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          npm ci --prefix extension
          bun run lint-fix 2>&1 | tee verification.log
          bun run check:encoding 2>&1 | tee -a verification.log
          bun run typecheck 2>&1 | tee -a verification.log
          bun run build:publish 2>&1 | tee -a verification.log
          bun run lint 2>&1 | tee -a verification.log
          bunx playwright test \
            tests/batch-execute.spec.ts tests/cdp.spec.ts tests/dialogs.spec.ts \
            tests/encoding-policy.spec.ts tests/evaluate.spec.ts tests/files.spec.ts \
            tests/iframes.spec.ts tests/navigation-context.spec.ts \
            tests/response-filtering.spec.ts tests/roots.spec.ts \
            tests/screenshot.spec.ts tests/tab-custom-ref.spec.ts tests/tabs.spec.ts \
            tests/trace.spec.ts tests/webdriver.spec.ts \
            --project=chromium 2>&1 | tee -a verification.log
          npm run build --prefix extension 2>&1 | tee -a verification.log
          xvfb-run --auto-servernum bunx playwright test \
            --config=extension/playwright.config.ts 2>&1 | tee -a verification.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-sonar-fix-verification-v5
          path: verification.log
          if-no-files-found: warn
          retention-days: 2

      - name: Commit fixes and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-ci-sonar-fixes*.yml
          rm -rf lib test-results playwright-report extension/test-results
          rm -f -- *.tgz tsconfig.tsbuildinfo verification.log
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore browser compatibility and SonarQube scope'
          git push origin HEAD:agent/adaptive-tool-discovery
