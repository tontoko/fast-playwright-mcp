# Triggered after the workflow existed on the branch.
name: Run PR 31 source-fix script

on:
  push:
    branches:
      - agent/pr31-review-fixes
    paths:
      - '.github/workflows/run-pr31-fix-script.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/pr31-review-fixes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply source edits
        run: python3 scripts/apply-pr31-review-fixes.py
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run update-readme
          bun run lint
          bun run benchmark:tools -- --check
          bunx playwright test \
            tests/upstream-config.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/output-manager.spec.ts \
            tests/partial-snapshot-css.spec.ts \
            tests/readme-contract.spec.ts \
            tests/tool-gateways.spec.ts \
            tests/network-origin-filter.spec.ts \
            tests/mcp-server-initialize.spec.ts \
            tests/response-partial-snapshot.spec.ts \
            --project=chromium \
            --workers=1
          git diff --check
      - name: Commit clean verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/run-pr31-fix-script.yml
          rm -f .github/workflows/apply-pr31-remaining-fixes.yml
          rm -f scripts/apply-pr31-review-fixes.py REVIEW_FIX_RESULT.md
          rm -rf lib test-results playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address PR review and harden runtime boundaries'
          git push origin HEAD:agent/pr31-review-fixes
