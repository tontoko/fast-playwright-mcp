name: Apply adaptive catalog foundation

on:
  pull_request:
    branches:
      - fix/all-open-issues

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - name: Check whether stage is complete
        id: stage
        shell: bash
        run: |
          if [[ -f src/tools/catalog/registry.ts ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.stage.outputs.needed == 'true'
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.stage.outputs.needed == 'true'
        with:
          node-version: '22'
      - name: Install dependencies
        if: steps.stage.outputs.needed == 'true'
        run: bun install --frozen-lockfile
      - name: Write catalog foundation
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        run: |
          mkdir -p src/tools/catalog
          cat > src/mcp/types.ts <<'EOF'
          import type {
            ImageContent,
            TextContent,
          } from '@modelcontextprotocol/sdk/types.js';
          import type { z } from 'zod';

          export type ToolEffect = 'readOnly' | 'action' | 'destructive';

          export type ToolResponse = {
            content: (TextContent | ImageContent)[];
            isError?: boolean;
          };

          export type ToolSchema<
            Input extends z.ZodTypeAny = z.ZodTypeAny,
          > = {
            name: string;
            title: string;
            description: string;
            inputSchema: Input;
            type: ToolEffect;
          };
          EOF

          cat > src/tools/catalog/types.ts <<'EOF'
          import type { AnyTool } from '../tool.js';

          export type ToolGroup =
            | 'bootstrap'
            | 'navigation'
            | 'interaction'
            | 'inspection'
            | 'diagnostics'
            | 'network'
            | 'storage'
            | 'testing'
            | 'devtools'
            | 'vision'
            | 'pdf'
            | 'apps';

          export type UpstreamSource = {
            repository: string;
            commit: string;
            path: string;
          };

          export type ToolRegistration = {
            tool: AnyTool;
            group: ToolGroup;
            aliases: readonly string[];
            keywords: readonly string[];
            bootstrap: boolean;
            upstreamSource?: UpstreamSource;
          };

          export type RegistrationOverrides = Record<
            string,
            Partial<Omit<ToolRegistration, 'tool'>>
          >;
          EOF

          cat > src/tools/catalog/registry.ts <<'EOF'
          import type { AnyTool } from '../tool.js';
          import type {
            RegistrationOverrides,
            ToolGroup,
            ToolRegistration,
          } from './types.js';

          const MAX_DESCRIPTION_LENGTH = 180;
          const WORD_PATTERN = /[a-z0-9]+/gu;

          function unique(values: readonly string[]): string[] {
            return [...new Set(values.map((value) => value.toLowerCase()))];
          }

          function inferToolGroup(tool: AnyTool): ToolGroup {
            const name = tool.schema.name;
            if (tool.capability === 'vision') return 'vision';
            if (tool.capability === 'pdf' || name.includes('pdf')) return 'pdf';
            if (name.startsWith('browser_network')) return 'network';
            if (
              name.startsWith('browser_tab_') ||
              name.startsWith('browser_navigate') ||
              name.includes('navigate_back') ||
              name.includes('navigate_forward')
            ) {
              return 'navigation';
            }
            if (name.includes('diagnose') || name.includes('find_elements')) {
              return 'diagnostics';
            }
            if (
              name.includes('snapshot') ||
              name.includes('screenshot') ||
              name.includes('inspect') ||
              name.includes('console') ||
              name.includes('evaluate') ||
              name.includes('wait') ||
              name === 'browser_find'
            ) {
              return 'inspection';
            }
            if (name.includes('storage') || name.includes('cookie')) {
              return 'storage';
            }
            if (name.includes('verify') || name.includes('expect')) {
              return 'testing';
            }
            return 'interaction';
          }

          function defaultKeywords(tool: AnyTool): string[] {
            const source = [
              tool.schema.name,
              tool.schema.title,
              tool.schema.description,
            ]
              .join(' ')
              .toLowerCase();
            return unique(source.match(WORD_PATTERN) ?? []);
          }

          export function registerTools(
            tools: readonly AnyTool[],
            overrides: RegistrationOverrides = {}
          ): ToolRegistration[] {
            return tools.map((tool) => {
              const override = overrides[tool.schema.name] ?? {};
              const alias = tool.schema.name
                .replace(/^browser_/u, '')
                .replaceAll('_', ' ');
              return {
                tool,
                group: override.group ?? inferToolGroup(tool),
                aliases: Object.freeze(
                  unique(override.aliases ?? (alias ? [alias] : []))
                ),
                keywords: Object.freeze(
                  unique(override.keywords ?? defaultKeywords(tool))
                ),
                bootstrap: override.bootstrap ?? false,
                upstreamSource: override.upstreamSource,
              };
            });
          }

          export class ToolRegistry {
            readonly registrations: readonly ToolRegistration[];
            private readonly byName: ReadonlyMap<string, ToolRegistration>;

            constructor(registrations: readonly ToolRegistration[]) {
              const byName = new Map<string, ToolRegistration>();
              for (const registration of registrations) {
                const name = registration.tool.schema.name;
                if (byName.has(name)) {
                  throw new Error(`Duplicate tool registration: ${name}`);
                }
                if (
                  registration.tool.schema.description.length >
                  MAX_DESCRIPTION_LENGTH
                ) {
                  throw new Error(
                    `Tool description exceeds 180 characters: ${name}`
                  );
                }
                byName.set(
                  name,
                  Object.freeze({
                    ...registration,
                    aliases: Object.freeze([...registration.aliases]),
                    keywords: Object.freeze([...registration.keywords]),
                  })
                );
              }
              this.registrations = Object.freeze([...byName.values()]);
              this.byName = byName;
            }

            get(name: string): ToolRegistration | undefined {
              return this.byName.get(name);
            }

            require(name: string): ToolRegistration {
              const registration = this.get(name);
              if (!registration) {
                throw new Error(`Unknown tool: ${name}`);
              }
              return registration;
            }

            names(): string[] {
              return this.registrations.map(({ tool }) => tool.schema.name);
            }

            byGroup(group: ToolGroup): ToolRegistration[] {
              return this.registrations.filter(
                (registration) => registration.group === group
              );
            }
          }
          EOF

          cat > src/tools/catalog/visibility.ts <<'EOF'
          import type { ToolProfile } from '../../../config.js';
          import type { ToolRegistry } from './registry.js';
          import type { ToolGroup, ToolRegistration } from './types.js';

          export const ADAPTIVE_BOOTSTRAP_NAMES = Object.freeze([
            'browser_tools',
            'browser_query',
            'browser_execute',
            'browser_batch_execute',
            'browser_navigate',
            'browser_snapshot',
            'browser_find',
          ] as const);

          export const MINIMAL_BOOTSTRAP_NAMES = Object.freeze([
            'browser_tools',
            'browser_query',
            'browser_execute',
          ] as const);

          export class ToolVisibility {
            private readonly enabled = new Set<string>();

            constructor(readonly profile: ToolProfile) {}

            visible(registry: ToolRegistry): ToolRegistration[] {
              if (this.profile === 'full') {
                return [...registry.registrations];
              }
              const bootstrap =
                this.profile === 'minimal'
                  ? MINIMAL_BOOTSTRAP_NAMES
                  : ADAPTIVE_BOOTSTRAP_NAMES;
              const names = new Set<string>([...bootstrap, ...this.enabled]);
              return registry.registrations.filter(({ tool }) =>
                names.has(tool.schema.name)
              );
            }

            visibleNames(registry: ToolRegistry): string[] {
              return this.visible(registry).map(({ tool }) => tool.schema.name);
            }

            enableTools(
              registry: ToolRegistry,
              names: readonly string[]
            ): boolean {
              if (this.profile === 'full') return false;
              for (const name of names) registry.require(name);
              const before = this.enabled.size;
              for (const name of names) this.enabled.add(name);
              return before !== this.enabled.size;
            }

            enableGroups(
              registry: ToolRegistry,
              groups: readonly ToolGroup[]
            ): boolean {
              return this.enableTools(
                registry,
                groups.flatMap((group) =>
                  registry.byGroup(group).map(({ tool }) => tool.schema.name)
                )
              );
            }

            disableTools(
              registry: ToolRegistry,
              names: readonly string[]
            ): boolean {
              if (this.profile === 'full') return false;
              for (const name of names) registry.require(name);
              let changed = false;
              for (const name of names) {
                changed = this.enabled.delete(name) || changed;
              }
              return changed;
            }

            disableGroups(
              registry: ToolRegistry,
              groups: readonly ToolGroup[]
            ): boolean {
              return this.disableTools(
                registry,
                groups.flatMap((group) =>
                  registry.byGroup(group).map(({ tool }) => tool.schema.name)
                )
              );
            }

            reset(): boolean {
              if (this.profile === 'full') return false;
              const changed = this.enabled.size > 0;
              this.enabled.clear();
              return changed;
            }
          }
          EOF

          cat > src/tools/catalog/search.ts <<'EOF'
          import type { ToolEffect } from '../../mcp/types.js';
          import type { ToolRegistry } from './registry.js';
          import type { ToolGroup, ToolRegistration } from './types.js';

          export type ToolSearchResult = {
            name: string;
            title: string;
            summary: string;
            group: ToolGroup;
            type: ToolEffect;
            score: number;
          };

          const GATEWAY_NAMES = new Set([
            'browser_tools',
            'browser_query',
            'browser_execute',
          ]);

          function score(
            registration: ToolRegistration,
            query: string
          ): number {
            const name = registration.tool.schema.name.toLowerCase();
            const title = registration.tool.schema.title.toLowerCase();
            const description =
              registration.tool.schema.description.toLowerCase();
            if (name === query) return 100;
            if (registration.aliases.some((alias) => alias === query)) return 90;
            if (name.includes(query)) return 70;
            if (registration.aliases.some((alias) => alias.includes(query))) {
              return 60;
            }
            if (title.includes(query)) return 50;
            if (registration.keywords.some((keyword) => keyword === query)) {
              return 30;
            }
            if (description.includes(query)) return 10;
            return 0;
          }

          export function searchTools(
            registry: ToolRegistry,
            rawQuery: string,
            limit = 6
          ): ToolSearchResult[] {
            const query = rawQuery.trim().toLowerCase();
            if (!query) return [];
            return registry.registrations
              .filter(
                ({ tool }) =>
                  !GATEWAY_NAMES.has(tool.schema.name) ||
                  tool.schema.name === query
              )
              .map((registration) => ({
                registration,
                score: score(registration, query),
              }))
              .filter(({ score: value }) => value > 0)
              .sort(
                (left, right) =>
                  right.score - left.score ||
                  left.registration.tool.schema.name.localeCompare(
                    right.registration.tool.schema.name
                  )
              )
              .slice(0, Math.max(1, Math.min(limit, 20)))
              .map(({ registration, score: value }) => ({
                name: registration.tool.schema.name,
                title: registration.tool.schema.title,
                summary: registration.tool.schema.description,
                group: registration.group,
                type: registration.tool.schema.type,
                score: value,
              }));
          }
          EOF

      - name: Patch shared types, config, and registry export
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one occurrence, found {count}: {old!r}'
                  )
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/mcp/tool.ts',
              "import type { z } from 'zod';\nimport { zodToJsonSchema } from 'zod-to-json-schema';\n\nexport type ToolSchema<Input extends z.Schema> = {\n  name: string;\n  title: string;\n  description: string;\n  inputSchema: Input;\n  type: 'readOnly' | 'destructive';\n};",
              "import type { z } from 'zod';\nimport { zodToJsonSchema } from 'zod-to-json-schema';\nimport type { ToolSchema } from './types.js';\n\nexport type { ToolEffect, ToolSchema } from './types.js';",
          )
          replace_once(
              'src/mcp/server.ts',
              "import type {\n  ImageContent,\n  TextContent,\n} from '@modelcontextprotocol/sdk/types.js';\n",
              '',
          )
          replace_once(
              'src/mcp/server.ts',
              "import type { z } from 'zod';\n",
              '',
          )
          replace_once(
              'src/mcp/server.ts',
              "import { toMcpTool } from './tool.js';\n",
              "import { toMcpTool } from './tool.js';\nimport type { ToolResponse, ToolSchema } from './types.js';\n",
          )
          old_types = "export type ToolResponse = {\n  content: (TextContent | ImageContent)[];\n  isError?: boolean;\n};\nexport type ToolSchema<Input extends z.ZodTypeAny = z.ZodTypeAny> = {\n  name: string;\n  title: string;\n  description: string;\n  inputSchema: Input;\n  type: 'readOnly' | 'destructive';\n};\n"
          replace_once(
              'src/mcp/server.ts',
              old_types,
              "export type { ToolResponse, ToolSchema } from './types.js';\n",
          )
          replace_once(
              'src/tools/tool.ts',
              "import type { ToolSchema } from '../mcp/server.js';",
              "import type { ToolResponse, ToolSchema } from '../mcp/types.js';",
          )
          replace_once(
              'src/tools/tool.ts',
              "    response: Response\n  ) => Promise<void>;",
              "    response: Response,\n    signal?: AbortSignal\n  ) => Promise<void | ToolResponse>;",
          )
          replace_once(
              'src/tools/tool.ts',
              "    response: Response\n  ) => Promise<void>;",
              "    response: Response,\n    signal?: AbortSignal\n  ) => Promise<void | ToolResponse>;",
          )
          replace_once(
              'src/tools/tool.ts',
              '    handle: async (context, params, response) => {',
              '    handle: async (context, params, response, signal) => {',
          )
          replace_once(
              'src/tools/tool.ts',
              '        return await tool.handle(tab, params, response);',
              '        return await tool.handle(tab, params, response, signal);',
          )

          replace_once(
              'config.d.ts',
              "  | 'pdf';\n\nexport type Config = {",
              "  | 'pdf';\n\nexport type ToolProfile = 'adaptive' | 'full' | 'minimal';\n\nexport type Config = {\n  /** Tool catalog profile. Defaults to adaptive. */\n  toolProfile?: ToolProfile;",
          )
          replace_once(
              'src/config.ts',
              "import type { Config, ToolCapability } from '../config.js';",
              "import type { Config, ToolCapability, ToolProfile } from '../config.js';",
          )
          replace_once(
              'src/config.ts',
              'export type CLIOptions = {\n',
              'export type CLIOptions = {\n  toolProfile?: ToolProfile;\n',
          )
          replace_once(
              'src/config.ts',
              'const defaultConfig: FullConfig = {\n',
              "const defaultConfig: FullConfig = {\n  toolProfile: 'adaptive',\n",
          )
          replace_once(
              'src/config.ts',
              'export type FullConfig = Config & {\n',
              'export type FullConfig = Config & {\n  toolProfile: ToolProfile;\n',
          )
          text = Path('src/config.ts').read_text(encoding='utf-8')
          target = "    | 'capabilities'\n"
          if text.count(target) != 2:
              raise SystemExit(
                  f'src/config.ts: expected two capability Pick entries, found {text.count(target)}'
              )
          text = text.replace(target, "    | 'toolProfile'\n    | 'capabilities'\n")
          Path('src/config.ts').write_text(text, encoding='utf-8')
          replace_once(
              'src/config.ts',
              '  return {\n    capabilities: cliOptions.caps as ToolCapability[],',
              '  return {\n    toolProfile: cliOptions.toolProfile,\n    capabilities: cliOptions.caps as ToolCapability[],',
          )
          replace_once(
              'src/config.ts',
              'function populateMiscellaneousOptions(options: CLIOptions): void {\n',
              "function populateMiscellaneousOptions(options: CLIOptions): void {\n  options.toolProfile = process.env.FAST_PLAYWRIGHT_TOOL_PROFILE\n    ? parseToolProfile(process.env.FAST_PLAYWRIGHT_TOOL_PROFILE)\n    : undefined;\n",
          )
          replace_once(
              'src/config.ts',
              'export function semicolonSeparatedList(\n',
              "export function parseToolProfile(value: string): ToolProfile {\n  if (value === 'adaptive' || value === 'full' || value === 'minimal') {\n    return value;\n  }\n  throw new Error(`Invalid tool profile: ${value}`);\n}\n\nexport function semicolonSeparatedList(\n",
          )
          replace_once(
              'src/program.ts',
              '  commaSeparatedList,\n  resolveCLIConfig,',
              '  commaSeparatedList,\n  parseToolProfile,\n  resolveCLIConfig,',
          )
          replace_once(
              'src/program.ts',
              "  .option('--cdp-endpoint <endpoint>', 'CDP endpoint to connect to.')",
              "  .option(\n    '--tool-profile <profile>',\n    'tool catalog profile: adaptive, full, or minimal',\n    parseToolProfile\n  )\n  .option('--cdp-endpoint <endpoint>', 'CDP endpoint to connect to.')",
          )

          replace_once(
              'src/tools.ts',
              "import type { AnyTool } from './tools/tool.js';",
              "import { ToolRegistry, registerTools } from './tools/catalog/registry.js';\nimport type { AnyTool } from './tools/tool.js';",
          )
          Path('src/tools.ts').write_text(
              Path('src/tools.ts').read_text(encoding='utf-8')
              + "\nexport function createBaseToolRegistry(config: FullConfig): ToolRegistry {\n  return new ToolRegistry(registerTools(filteredTools(config)));\n}\n",
              encoding='utf-8',
          )

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['dependencies']['@modelcontextprotocol/sdk'] = '1.25.2'
          package_path.write_text(
              json.dumps(package, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Refresh dependencies and format
        if: steps.stage.outputs.needed == 'true'
        run: |
          bun install
          bun run lint-fix
      - name: Verify implementation
        if: steps.stage.outputs.needed == 'true'
        run: |
          bun run build:publish
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            --project=chromium
          bun run lint
      - name: Commit implementation
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add adaptive tool catalog foundation'
          git push origin HEAD:agent/adaptive-tool-discovery
