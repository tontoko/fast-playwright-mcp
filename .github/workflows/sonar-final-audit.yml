name: Sonar final audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sonar-final-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public SonarQube Cloud analysis
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonarcloud.io/api'
          project='tontoko_fast-playwright-mcp'
          pr='31'
          fetch() {
            local path="$1"
            echo "=== ${path} ==="
            curl --silent --show-error --fail --location \
              --max-time 40 \
              --user-agent 'fast-playwright-mcp-final-audit/1.0' \
              "${base}/${path}"
            echo
          }
          fetch "qualitygates/project_status?projectKey=${project}&pullRequest=${pr}"
          fetch "issues/search?componentKeys=${project}&pullRequest=${pr}&resolved=false&ps=500&additionalFields=_all"
          fetch "measures/component?component=${project}&pullRequest=${pr}&metricKeys=new_reliability_rating,new_security_rating,new_maintainability_rating,new_bugs,new_vulnerabilities,new_code_smells,new_duplicated_lines_density,new_security_hotspots_reviewed"
          fetch "project_pull_requests/list?project=${project}"
