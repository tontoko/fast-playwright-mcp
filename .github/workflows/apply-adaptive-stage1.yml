              'export type FullConfig = Config & {\n',
              'export type FullConfig = Config & {\n  toolProfile: ToolProfile;\n',
          )
          text = Path('src/config.ts').read_text()
          target = "    | 'capabilities'\n"
          if text.count(target) != 2:
              raise SystemExit(f'src/config.ts: expected two Pick capability entries, found {text.count(target)}')
          text = text.replace(target, "    | 'toolProfile'\n    | 'capabilities'\n")
          Path('src/config.ts').write_text(text)
          replace_once(
