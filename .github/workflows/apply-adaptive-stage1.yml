            ...consoleTools,
            ...dialogs,
            ...evaluate,
            ...files,
            ...install,
            ...inspectHtml,
            ...keyboard,
            ...navigate,
            ...network,
            ...mouse,
            ...pdf,
            ...screenshot,
            ...snapshot,
            ...tabs,
            ...wait,
            batchExecuteTool,
            browserFindElements,
            browserDiagnose,
          ];

          export function filteredTools(config: FullConfig): AnyTool[] {
            return allTools.filter(
              (tool) =>
                tool.capability.startsWith('core') ||
                config.capabilities?.includes(tool.capability)
            );
          }

          export function createBaseToolRegistry(
            config: FullConfig
          ): ToolRegistry {
            return new ToolRegistry(registerTools(filteredTools(config)));
          }
