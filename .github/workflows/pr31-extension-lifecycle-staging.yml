# Triggered after registration on the staging branch.
name: PR 31 extension lifecycle staging

on:
  push:
    branches:
      - agent/pr31-review-fixes
    paths:
      - 'extension/**'
      - 'src/extension/**'
      - 'src/browser-context-factory.ts'
      - '.github/workflows/pr31-extension-lifecycle-staging.yml'

permissions:
  contents: write

concurrency:
  group: pr31-extension-lifecycle-staging
  cancel-in-progress: true

jobs:
  extension:
    if: ${{ !contains(github.event.head_commit.message, '[extension-lifecycle-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/pr31-review-fixes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build:publish
          npm ci --prefix extension
          npm run build --prefix extension
          bunx playwright install --with-deps chromium
      - name: Run extension rejection regression and record result
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        shell: bash
        run: |
          set +e
          set -o pipefail
          xvfb-run --auto-servernum bunx playwright test \
            --config=extension/playwright.config.ts \
            --grep='rejecting a pending relay' \
            --workers=1 2>&1 | tee extension-lifecycle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then result=PASS; else result=FAIL; fi
          {
            printf '# Extension lifecycle verification\n\n'
            printf -- '- result: %s\n' "$result"
            printf -- '- source commit: %s\n\n' "$GITHUB_SHA"
            printf '## Output tail\n\n```text\n'
            tail -n 260 extension-lifecycle.log
            printf '\n```\n'
          } > EXTENSION_LIFECYCLE_RESULT.md
          rm -rf lib test-results playwright-report extension/dist
          rm -f extension-lifecycle.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXTENSION_LIFECYCLE_RESULT.md
          git commit -m "test: record extension lifecycle ${result} [extension-lifecycle-result]"
          git push origin HEAD:agent/pr31-review-fixes
          exit "$status"
