name: Probe final PR 31 status

on:
  push:
    branches:
      - agent/sonar-status-probe
    paths:
      - '.github/workflows/staging-run-probe.yml'
      - '.github/staging-run-probe/TRIGGER'

permissions:
  actions: read
  checks: read
  contents: write
  statuses: read

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[staging-run-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 3795262331742b87fc04d604a62e5282a0fd1afc
      PROJECT_KEY: tontoko_fast-playwright-mcp
      TARGET_PR: '31'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/sonar-status-probe
          fetch-depth: 0

      - name: Query GitHub and Sonar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root='.github/staging-run-probe'
          mkdir -p "$root"

          github_api() {
            curl --silent --show-error --location \
              --max-time 40 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }
          sonar_api() {
            curl --silent --show-error --location \
              --max-time 40 \
              --user-agent 'fast-playwright-mcp-final-probe/1.0' \
              "$1"
          }

          github_api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=50" \
            > "$root/runs.json"
          github_api "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
            > "$root/check-runs.json"
          github_api "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status" \
            > "$root/legacy-status.json"

          sonar_api "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&pullRequest=${TARGET_PR}" \
            > "$root/quality-gate.json"
          sonar_api "https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT_KEY}&pullRequest=${TARGET_PR}&resolved=false&ps=500" \
            > "$root/issues.json"
          sonar_api "https://sonarcloud.io/api/measures/component?component=${PROJECT_KEY}&pullRequest=${TARGET_PR}&metricKeys=new_reliability_rating,new_security_rating,new_maintainability_rating,new_bugs,new_vulnerabilities,new_code_smells,new_duplicated_lines_density,new_security_hotspots_reviewed" \
            > "$root/measures.json"
          sonar_api "https://sonarcloud.io/api/project_pull_requests/list?project=${PROJECT_KEY}" \
            > "$root/pull-requests.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.github/staging-run-probe')
          target_sha = '3795262331742b87fc04d604a62e5282a0fd1afc'

          def load(name: str):
              return json.loads((root / name).read_text(encoding='utf-8'))

          runs = load('runs.json').get('workflow_runs', [])
          checks = load('check-runs.json').get('check_runs', [])
          legacy = load('legacy-status.json')
          gate = load('quality-gate.json').get('projectStatus', {})
          issues = load('issues.json')
          measure_payload = load('measures.json')
          prs = load('pull-requests.json').get('pullRequests', [])
          sonar_pr = next((item for item in prs if str(item.get('key')) == '31'), {})
          measures = {
              item.get('metric'): item.get('period', {}).get('value', item.get('value'))
              for item in measure_payload.get('component', {}).get('measures', [])
          }

          lines = [
              '# Final PR 31 status',
              '',
              f'- target SHA: {target_sha}',
              f"- Sonar analyzed revision: {sonar_pr.get('revision')}",
              f"- Sonar analysis date: {sonar_pr.get('analysisDate')}",
              f"- Sonar quality gate: {gate.get('status')}",
              f"- unresolved Sonar issues: {issues.get('total')}",
              f"- GitHub aggregate status: {legacy.get('state')}",
              '',
              '## Workflow runs',
          ]
          for run in runs:
              lines.append(
                  f"- {run.get('name')} #{run.get('run_number')}: "
                  f"status={run.get('status')}, conclusion={run.get('conclusion')}"
              )

          lines.extend(['', '## Check runs'])
          for check in checks:
              app = check.get('app') or {}
              lines.append(
                  f"- {check.get('name')} ({app.get('slug')}): "
                  f"status={check.get('status')}, conclusion={check.get('conclusion')}"
              )

          lines.extend(['', '## Sonar measures'])
          for key in sorted(measures):
              lines.append(f'- {key}: {measures[key]}')

          lines.extend(['', '## Sonar quality-gate conditions'])
          for condition in gate.get('conditions', []):
              lines.append(
                  f"- {condition.get('metricKey')}: status={condition.get('status')}, "
                  f"actual={condition.get('actualValue')}, threshold={condition.get('errorThreshold')}"
              )

          (root / 'RESULTS.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/staging-run-probe
          git commit -m 'chore: record final PR 31 status [staging-run-result]'
          git push origin HEAD:agent/sonar-status-probe
