name: Probe staging workflow runs

on:
  push:
    branches:
      - agent/sonar-status-probe
    paths:
      - '.github/workflows/staging-run-probe.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[staging-run-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/sonar-status-probe
          fetch-depth: 0
      - name: Query staging workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/staging-run-probe
          curl --silent --show-error --location \
            --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fsonar-quality-gate-fixes&per_page=30" \
            > .github/staging-run-probe/runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('.github/staging-run-probe/runs.json').read_text(encoding='utf-8')
          )
          lines = ['# Staging workflow runs', '']
          for run in payload.get('workflow_runs', []):
              lines.extend([
                  f"## {run.get('name')} #{run.get('run_number')}",
                  f"- id: {run.get('id')}",
                  f"- event: {run.get('event')}",
                  f"- head_sha: {run.get('head_sha')}",
                  f"- status: {run.get('status')}",
                  f"- conclusion: {run.get('conclusion')}",
                  f"- created_at: {run.get('created_at')}",
                  f"- updated_at: {run.get('updated_at')}",
                  f"- html_url: {run.get('html_url')}",
                  '',
              ])
          Path('.github/staging-run-probe/RESULTS.md').write_text(
              '\n'.join(lines), encoding='utf-8'
          )
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/staging-run-probe
          git commit -m 'chore: record staging workflow runs [staging-run-result]'
          git push origin HEAD:agent/sonar-status-probe
