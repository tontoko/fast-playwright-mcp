# Refresh marker: 2026-08-01-pr31-review-fixes-3
name: Probe staging workflow runs

on:
  push:
    branches:
      - agent/sonar-status-probe
    paths:
      - '.github/workflows/staging-run-probe.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[staging-run-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/sonar-status-probe
          fetch-depth: 0
      - name: Query PR 31 staging workflow runs and latest failure log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root='.github/staging-run-probe'
          mkdir -p "$root"
          api() {
            curl --silent --show-error --location \
              --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }
          api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fpr31-review-fixes&per_page=50" \
            > "$root/runs.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.github/staging-run-probe')
          payload = json.loads((root / 'runs.json').read_text(encoding='utf-8'))
          lines = ['# PR 31 staging workflow runs', '']
          latest_failed_run = None
          for run in payload.get('workflow_runs', []):
              lines.extend([
                  f"## {run.get('name')} #{run.get('run_number')}",
                  f"- id: {run.get('id')}",
                  f"- event: {run.get('event')}",
                  f"- head_sha: {run.get('head_sha')}",
                  f"- status: {run.get('status')}",
                  f"- conclusion: {run.get('conclusion')}",
                  f"- created_at: {run.get('created_at')}",
                  f"- updated_at: {run.get('updated_at')}",
                  f"- html_url: {run.get('html_url')}",
                  '',
              ])
              if latest_failed_run is None and run.get('conclusion') == 'failure':
                  latest_failed_run = run.get('id')
          (root / 'RESULTS.md').write_text('\n'.join(lines), encoding='utf-8')
          (root / 'LATEST_FAILED_RUN').write_text(
              str(latest_failed_run or ''), encoding='utf-8'
          )
          PY

          failed_run="$(cat "$root/LATEST_FAILED_RUN")"
          if [ -n "$failed_run" ]; then
            api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${failed_run}/jobs?filter=latest&per_page=100" \
              > "$root/latest-failed-jobs.json"
            job_id="$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path('.github/staging-run-probe/latest-failed-jobs.json').read_text(
                  encoding='utf-8'
              )
          )
          jobs = payload.get('jobs', [])
          failed = next((job for job in jobs if job.get('conclusion') == 'failure'), None)
          print((failed or (jobs[0] if jobs else {})).get('id', ''))
          PY
            )"
            if [ -n "$job_id" ]; then
              curl --silent --show-error --location \
                --max-time 60 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
                > "$root/latest-failed-job-full.txt"
              tail -n 400 "$root/latest-failed-job-full.txt" \
                > "$root/latest-failed-job-tail.txt"
              rm "$root/latest-failed-job-full.txt"
            fi
          fi
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/staging-run-probe
          git commit -m 'chore: record staging workflow runs [staging-run-result]'
          git push origin HEAD:agent/sonar-status-probe
