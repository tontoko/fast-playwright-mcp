name: Diagnose clean final patch

on:
  pull_request:
    branches:
      - agent/pr31-staging-base
    paths:
      - .github/workflows/diagnose-clean-patch.yml
      - .github/final-patch-clean/part-00.b64

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
      - name: Inspect staged patch
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/diagnostic
          file=.github/final-patch-clean/part-00.b64
          {
            echo "base64_bytes=$(wc -c < "$file")"
            echo "base64_sha256=$(sha256sum "$file" | awk '{print $1}')"
            base64 --decode "$file" > /tmp/diagnostic/patch.gz
            echo "decode_status=$?"
            echo "decoded_bytes=$(wc -c < /tmp/diagnostic/patch.gz)"
            echo "decoded_sha256=$(sha256sum /tmp/diagnostic/patch.gz | awk '{print $1}')"
            gzip -t /tmp/diagnostic/patch.gz
            echo "gzip_status=$?"
          } > /tmp/diagnostic/diagnostic.txt 2>&1
          cat /tmp/diagnostic/diagnostic.txt
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-patch-diagnostic
          path: /tmp/diagnostic
          if-no-files-found: error
          retention-days: 1
