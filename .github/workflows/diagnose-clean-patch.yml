name: Diagnose clean final patch

on:
  pull_request:
    branches:
      - agent/pr31-staging-base
    paths:
      - .github/workflows/diagnose-clean-patch.yml
      - .github/final-patch-clean/part-00.b64

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/adaptive-tool-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0
      - name: Inspect staged patch
        shell: bash
        run: |
          set -u
          mkdir -p .github/final-patch-clean
          {
            echo "base64_bytes=$(wc -c < .github/final-patch-clean/part-00.b64)"
            base64 --decode .github/final-patch-clean/part-00.b64 > /tmp/patch.gz
            echo "decode_status=$?"
            echo "decoded_bytes=$(wc -c < /tmp/patch.gz)"
            echo "decoded_sha256=$(sha256sum /tmp/patch.gz | awk '{print $1}')"
            gzip -t /tmp/patch.gz
            echo "gzip_status=$?"
          } > .github/final-patch-clean/diagnostic.txt 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/final-patch-clean/diagnostic.txt
          git commit -m 'chore: record clean patch diagnostics'
          git push origin HEAD:agent/adaptive-tool-discovery
