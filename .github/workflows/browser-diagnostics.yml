name: Browser diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: browser-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  first-failure:
    name: First failure (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, chromium, msedge, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.project }}" == "chromium" ]]; then
            bunx playwright install --with-deps chromium
          else
            bunx playwright install --with-deps chromium "${{ matrix.project }}"
          fi
      - name: Build
        run: bun run build:publish
      - name: Capture first failing test
        shell: bash
        run: |
          set +e
          set -o pipefail
          bunx playwright test \
            --project="${{ matrix.project }}" \
            --workers=1 \
            --max-failures=1 \
            --reporter=line \
            2>&1 | tee "browser-${{ matrix.project }}.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "browser-${{ matrix.project }}.status"
          tail -n 400 "browser-${{ matrix.project }}.log" > "browser-${{ matrix.project }}-tail.log"
          exit 0
      - name: Upload concise diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.project }}-first-failure
          path: |
            browser-${{ matrix.project }}-tail.log
            browser-${{ matrix.project }}.status
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        shell: bash
        run: test "$(cat browser-${{ matrix.project }}.status)" = '0'
