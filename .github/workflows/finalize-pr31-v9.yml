name: Finalize pull request 31 v9

on:
  pull_request:
    branches: [main, fix/all-open-issues]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: finalize-pull-request-31-v9
  cancel-in-progress: false

jobs:
  finalize:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 31) && (github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-tool-discovery')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BUNDLE_URL: https://filebin.net/fp-oai-complete-v9-89c6fdfd985548b89214513e45c67c6a/fast-playwright-complete-v9.tar.gz
      CHECKSUM_URL: https://filebin.net/fp-oai-complete-v9-89c6fdfd985548b89214513e45c67c6a/fast-playwright-complete-v9.sha256
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Wait for repeatedly self-reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          downloaded=false
          for attempt in $(seq 1 600); do
            if curl --fail --location --silent --show-error "$BUNDLE_URL" -o /tmp/source.tar.gz && \
               curl --fail --location --silent --show-error "$CHECKSUM_URL" -o /tmp/source.sha256; then
              downloaded=true
              break
            fi
            sleep 30
          done
          test "$downloaded" = true
          expected=$(awk '{print $1}' /tmp/source.sha256)
          actual=$(sha256sum /tmp/source.tar.gz | awk '{print $1}')
          test -n "$expected"
          test "$expected" = "$actual"

      - name: Replace branch source and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/source.tar.gz -C .
          rm -f .github/workflows/apply-complete-bundle*.yml
          rm -f .github/workflows/finalize-pr31*.yml
          rm -f .github/workflows/adaptive-tool-discovery-ci.yml
          rm -f .github/workflows/implementation-sync.yml
          rm -f .github/workflows/export-source.yml
          rm -f .github/workflows/export-development-environment.yml
          rm -rf docs/superpowers tmp

      - name: Verify repository ownership and workflow policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'issues:[[:space:]]*write|gh[[:space:]]+issue|gh[[:space:]]+pr[[:space:]]+(close|merge)' .github/workflows --include='*.yml' --include='*.yaml'; then
            exit 1
          fi
          while IFS= read -r line; do
            ref=${line#*@}; ref=${ref%% *}
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Unpinned action: $line" >&2; exit 1; }
          done < <(grep -RhE '^[[:space:]]*-[[:space:]]+uses:' .github/workflows)

      - name: Verify locally repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cp src/apps/generated/dashboard.ts /tmp/dashboard-before.ts
          bun run build:dashboard
          cmp /tmp/dashboard-before.ts src/apps/generated/dashboard.ts
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check
          bun run upstream:check:fixture > /tmp/upstream-a.md
          bun run upstream:check:fixture > /tmp/upstream-b.md
          diff -u /tmp/upstream-a.md /tmp/upstream-b.md
          bunx playwright install --with-deps chromium
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            tests/tool-gateways.spec.ts \
            tests/browser-find.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/output-manager.spec.ts \
            tests/secret-redaction.spec.ts \
            tests/mcp-resources.spec.ts \
            tests/dashboard-build.spec.ts \
            tests/dashboard-render.spec.ts \
            tests/dashboard-e2e.spec.ts \
            --project=chromium
          bun run test:package
          npm ci --prefix extension
          npm run build --prefix extension

      - name: Push only the clean source for pull request 31
        id: push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report
          rm -f *.tgz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: complete final validation follow-ups'
            git push origin HEAD:agent/adaptive-tool-discovery
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update only pull request 31 metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          This pull request consolidates the repository maintenance and architecture work into one reviewed change set.

          It includes:

          - restored and hardened CI coverage with immutable GitHub Action references
          - an adaptive MCP tool catalog with `adaptive`, `minimal`, and `full` profiles
          - deterministic tool discovery and schema-validated read-only/action gateways
          - compact accessibility-snapshot search and enforced context budgets
          - selected Microsoft Playwright MCP compatibility and security improvements while retaining the local lint and formatting toolchain
          - read-only upstream compatibility reporting and source attribution
          - an offline, opt-in MCP Apps dashboard with CSP and XSS-focused tests
          - package-install, browser, extension, Docker, and protocol conformance coverage

          The default adaptive catalog exposes seven tools and keeps the serialized startup list below the enforced 12,000-byte budget. Existing static behavior remains available with `--tool-profile=full`.

          This pull request does not edit, close, label, or comment on repository issues or other contributors' pull requests.
          EOF
          gh pr edit 31 --repo "$GITHUB_REPOSITORY" --base main --title 'feat: improve tool discovery, upstream compatibility, and MCP Apps support' --body-file /tmp/pr-body.md

      - name: Wait for hosted matrix, extension, Docker, and quality checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='${{ steps.push.outputs.sha }}'
          found=false
          for attempt in $(seq 1 160); do
            current_sha=$(gh pr view 31 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            test "$current_sha" = "$expected_sha"
            count=$(gh pr checks 31 --repo "$GITHUB_REPOSITORY" --json name 2>/dev/null | jq length || echo 0)
            if [[ "$count" -gt 0 ]]; then found=true; break; fi
            sleep 15
          done
          test "$found" = true
          gh pr checks 31 --repo "$GITHUB_REPOSITORY" --watch --fail-fast

      - name: Read-only check for unresolved review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unresolved=$(gh api graphql \
            -f owner='${{ github.repository_owner }}' \
            -f name='${{ github.event.repository.name }}' \
            -F number=31 \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          test "$unresolved" -eq 0

      - name: Mark only pull request 31 ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr ready 31 --repo "$GITHUB_REPOSITORY"
