name: SonarQube PR 31 diagnostics

on:
  push:
    branches:
      - agent/sonar-pr31-diagnostics
    paths:
      - .github/workflows/sonar-pr31-diagnostics.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/sonar-pr31-diagnostics
          fetch-depth: 0

      - name: Collect public SonarQube Cloud API responses
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/sonar-pr31-diagnostics
          mkdir -p .github/sonar-pr31-diagnostics

          query() {
            local name="$1"
            shift
            local url="$1"
            shift
            echo "GET ${url}" > ".github/sonar-pr31-diagnostics/${name}.request.txt"
            curl --location --silent --show-error \
              --connect-timeout 20 --max-time 60 \
              --dump-header ".github/sonar-pr31-diagnostics/${name}.headers.txt" \
              --output ".github/sonar-pr31-diagnostics/${name}.json" \
              --get "$url" "$@" || true
            python3 - "$name" <<'PY'
          import json
          import pathlib
          import sys

          name = sys.argv[1]
          path = pathlib.Path('.github/sonar-pr31-diagnostics') / f'{name}.json'
          try:
              payload = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(0)
          path.with_suffix('.pretty.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          }

          query quality-gate https://sonarcloud.io/api/qualitygates/project_status \
            --data-urlencode projectKey=tontoko_fast-playwright-mcp \
            --data-urlencode pullRequest=31

          query issues https://sonarcloud.io/api/issues/search \
            --data-urlencode componentKeys=tontoko_fast-playwright-mcp \
            --data-urlencode pullRequest=31 \
            --data-urlencode resolved=false \
            --data-urlencode ps=500 \
            --data-urlencode additionalFields=_all

          query measures https://sonarcloud.io/api/measures/component \
            --data-urlencode component=tontoko_fast-playwright-mcp \
            --data-urlencode pullRequest=31 \
            --data-urlencode metricKeys=new_reliability_rating,new_security_rating,new_maintainability_rating,new_bugs,new_vulnerabilities,new_code_smells,new_security_hotspots

          query hotspots https://sonarcloud.io/api/hotspots/search \
            --data-urlencode projectKey=tontoko_fast-playwright-mcp \
            --data-urlencode pullRequest=31 \
            --data-urlencode ps=500

          query pull-requests https://sonarcloud.io/api/project_pull_requests/list \
            --data-urlencode project=tontoko_fast-playwright-mcp

      - name: Commit diagnostics to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/sonar-pr31-diagnostics
          if git diff --cached --quiet; then
            echo 'Diagnostics are unchanged.'
          else
            git commit -m 'chore: record SonarQube PR diagnostics'
            git push origin HEAD:agent/sonar-pr31-diagnostics
          fi

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-pr31-diagnostics
          path: .github/sonar-pr31-diagnostics
          if-no-files-found: error
          retention-days: 1
