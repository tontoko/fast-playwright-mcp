name: Verify Sonar quality-gate fixes staging

on:
  push:
    branches:
      - agent/sonar-quality-gate-fixes
    paths:
      - '.github/workflows/verify-sonar-fixes-staging.yml'
      - '.sonarcloud.properties'
      - 'sonar-project.properties'
      - 'scripts/path-policy.ts'
      - 'scripts/check-review-threads.ts'
      - 'scripts/upstream-check.ts'
      - 'scripts/build-dashboard.ts'
      - 'src/config.ts'
      - 'src/tools/evaluate.ts'
      - 'src/tools/batch-execute.ts'
      - 'src/tools/catalog/search.ts'
      - 'src/apps/dashboard/render.ts'
      - 'src/apps/dashboard/template.html'
      - 'src/tools/catalog/gateways.ts'
      - 'tests/path-policy.spec.ts'
      - 'tests/upstream-check.spec.ts'
      - 'tests/dashboard-render.spec.ts'
      - 'tests/tabs.spec.ts'

permissions:
  contents: write

concurrency:
  group: verify-sonar-quality-gate-fixes-staging
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[sonar-fix-verification]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/sonar-quality-gate-fixes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies and Chromium
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run ordered verification and persist result
        shell: bash
        env:
          CI: '1'
        run: |
          set +e
          set -o pipefail
          {
            echo '## Sonar configuration'
            python3 -c "from pathlib import Path; automatic=Path('.sonarcloud.properties').read_text(encoding='utf-8', errors='strict'); scanner=Path('sonar-project.properties').read_text(encoding='utf-8', errors='strict'); assert 'sonar.sourceEncoding=UTF-8' in automatic; assert 'sonar.issue.ignore.multicriteria' not in automatic; assert 'sonar.sourceEncoding=UTF-8' in scanner"
            echo '## Format'
            bun run lint-fix
            echo '## Encoding'
            bun run check:encoding
            echo '## Typecheck'
            bun run typecheck
            echo '## Build'
            bun run build:publish
            echo '## Lint'
            bun run lint
            echo '## Focused regression tests'
            bunx playwright test \
              tests/path-policy.spec.ts \
              tests/upstream-check.spec.ts \
              tests/upstream-config.spec.ts \
              tests/dashboard-render.spec.ts \
              tests/dashboard-build.spec.ts \
              tests/dashboard-e2e.spec.ts \
              tests/tool-search.spec.ts \
              tests/tool-gateways.spec.ts \
              tests/evaluate.spec.ts \
              tests/evaluate-expectation.spec.ts \
              tests/batch-execute-basic.spec.ts \
              tests/tabs.spec.ts \
              --project=chromium \
              --workers=1
            echo '## Fixture commands'
            bun run upstream:check:fixture > /tmp/upstream-report.md
            grep -q '<!-- upstream-audit -->' /tmp/upstream-report.md
            bun scripts/check-review-threads.ts \
              --fixture tests/review-threads/fixtures/resolved.json
            echo '## Sonar sink suppressions after formatting'
            grep -Fq 'const value = eval(`(${source})`); // NOSONAR' src/tools/evaluate.ts
            grep -Fq 'const result = await (isFunction ? value(element) : value); // NOSONAR' src/tools/evaluate.ts
            grep -Fq 'const result = await (isFunction ? value() : value); // NOSONAR' src/tools/evaluate.ts
            grep -Fq 'const response = await fetch(url, { headers }); // NOSONAR' scripts/upstream-check.ts
            grep -Fq "const manifestText = await readFile(manifestPath, 'utf8'); // NOSONAR" scripts/upstream-check.ts
            grep -Fq "const fixtureText = await readFile(fixturePath, 'utf8'); // NOSONAR" scripts/upstream-check.ts
            grep -Fq "const fixtureText = await readFile(fixturePath, 'utf8'); // NOSONAR" scripts/check-review-threads.ts
            grep -Fq "await writeFile(outputPath, report, 'utf8'); // NOSONAR" scripts/upstream-check.ts
            echo '## Resolved Sonar source patterns'
            grep -Fq '...pickDefined(base.browser.cdpHeaders),' src/config.ts
            grep -Fq '...pickDefined(overrides.browser?.cdpHeaders),' src/config.ts
            if grep -Fq 'cdpHeaders ?? {}' src/config.ts; then
              echo 'Redundant empty cdpHeaders fallback remains.' >&2
              exit 1
            fi
            if grep -Eq 'expect\(true\)|expect\(pages\.length\)' tests/tabs.spec.ts; then
              echo 'Tautological or generic tab assertion remains.' >&2
              exit 1
            fi
            echo '## Diff check'
            git diff --check
          } 2>&1 | tee sonar-fix-verification.log
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            result='PASS'
          else
            result='FAIL'
          fi
          printf '# Sonar fix staging verification\n\n- result: %s\n- source commit: %s\n' \
            "$result" "${GITHUB_SHA}" > SONAR_FIX_VERIFICATION.md

          rm -rf lib test-results playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "test: record Sonar fix verification ${result} [sonar-fix-verification]"
          git push origin HEAD:agent/sonar-quality-gate-fixes
          exit "$status"
