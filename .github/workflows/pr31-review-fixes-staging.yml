name: PR 31 review fixes staging

on:
  push:
    branches:
      - agent/pr31-review-fixes

permissions:
  contents: read

concurrency:
  group: pr31-review-fixes-staging
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/pr31-review-fixes
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Run focused review regressions
        run: >-
          bunx playwright test
          tests/upstream-config.spec.ts
          tests/http-allowed-hosts.spec.ts
          --project=chromium
          --workers=1
