name: PR 31 review fixes staging

on:
  push:
    branches:
      - agent/pr31-review-fixes

permissions:
  contents: write

concurrency:
  group: pr31-review-fixes-staging
  cancel-in-progress: true

jobs:
  focused:
    if: ${{ !contains(github.event.head_commit.message, '[review-fix-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/pr31-review-fixes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Run focused review regressions and record result
        shell: bash
        run: |
          set +e
          set -o pipefail
          bunx playwright test \
            tests/upstream-config.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            --project=chromium \
            --workers=1 2>&1 | tee review-fix-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            result=PASS
          else
            result=FAIL
          fi
          printf '# PR 31 review-fix verification\n\n- result: %s\n- source commit: %s\n' \
            "$result" "$GITHUB_SHA" > REVIEW_FIX_RESULT.md
          rm -rf test-results playwright-report
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REVIEW_FIX_RESULT.md review-fix-test.log
          git commit -m "test: record review fix ${result} [review-fix-result]"
          git push origin HEAD:agent/pr31-review-fixes
          exit "$status"
