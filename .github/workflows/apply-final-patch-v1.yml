name: Apply verified final patch to pull request 31

on:
  push:
    branches:
      - agent/adaptive-tool-discovery
    paths:
      - .github/final-patch-v1/READY

permissions:
  contents: write

concurrency:
  group: apply-verified-final-patch-pr31
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Reassemble and verify final patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-patch-v1/part-*.b64 | base64 --decode > /tmp/pr31-final.patch.gz
          echo '6a87ee183e0c9be45b73aad91f780841d01c25d494213ed23aa51fe759b31b03  /tmp/pr31-final.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/pr31-final.patch.gz > /tmp/pr31-final.patch
          git apply --check --binary -p3 /tmp/pr31-final.patch

      - name: Apply final patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git apply --binary -p3 /tmp/pr31-final.patch
          rm -rf \
            .github/final-patch \
            .github/final-patch-clean \
            .github/final-patch-v1 \
            .github/final-source \
            .github/final-source-v2 \
            .github/final-source-v3 \
            .github/final-source-v4 \
            .github/final-source-v5 \
            .github/final-source-v6 \
            .github/implementation-bundle \
            .github/pr31-source \
            .github/pr31-source-archive \
            .github/pr31-source-parts \
            .github/pr31-source-parts-v2 \
            .github/pr31-source-plain \
            .github/source-bundle-parts \
            .github/temp
          find .github/workflows -maxdepth 1 -type f \( \
            -name 'apply-complete-bundle*.yml' -o \
            -name 'apply-final-patch*.yml' -o \
            -name 'apply-final-source*.yml' -o \
            -name 'apply-pr31-source-archive.yml' -o \
            -name 'diagnose-final-source.yml' -o \
            -name 'finalize-pr31*.yml' -o \
            -name 'adaptive-tool-discovery-ci.yml' -o \
            -name 'implementation-sync.yml' -o \
            -name 'export-source.yml' -o \
            -name 'export-dev-env.yml' \
          \) -delete

      - name: Verify repository workflow policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'issues:[[:space:]]*write|gh[[:space:]]+issue|gh[[:space:]]+pr[[:space:]]+(close|merge)' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Repository workflows must not mutate issues or unrelated pull requests.' >&2
            exit 1
          fi
          while IFS= read -r line; do
            ref=${line#*@}
            ref=${ref%% *}
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Unpinned GitHub Action: $line" >&2
              exit 1
            }
          done < <(grep -RhE '^[[:space:]]*-[[:space:]]+uses:' .github/workflows)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated dashboard is deterministic
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/apps/generated/dashboard.ts
          bun run build:dashboard
          cp src/apps/generated/dashboard.ts /tmp/dashboard-first.ts
          rm -f src/apps/generated/dashboard.ts
          bun run build:dashboard
          cmp /tmp/dashboard-first.ts src/apps/generated/dashboard.ts

      - name: Typecheck, build, lint, and context budget
        run: |
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check

      - name: Verify deterministic upstream report
        shell: bash
        run: |
          set -euo pipefail
          bun run upstream:check:fixture > /tmp/upstream-a.md
          bun run upstream:check:fixture > /tmp/upstream-b.md
          diff -u /tmp/upstream-a.md /tmp/upstream-b.md

      - name: Install Chromium for focused validation
        run: bunx playwright install --with-deps chromium

      - name: Run focused contract and security tests
        run: |
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            tests/tool-gateways.spec.ts \
            tests/tool-context-budget.spec.ts \
            tests/browser-find.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/output-manager.spec.ts \
            tests/secret-redaction.spec.ts \
            tests/mcp-resources.spec.ts \
            tests/dashboard-build.spec.ts \
            tests/dashboard-render.spec.ts \
            tests/dashboard-e2e.spec.ts \
            tests/upstream-check.spec.ts \
            tests/upstream-config.spec.ts \
            tests/review-threads.spec.ts \
            --project=chromium

      - name: Verify packed package and extension build
        run: |
          bun run test:package
          npm ci --prefix extension
          npm run build --prefix extension

      - name: Commit clean verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report src/apps/generated
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete tool discovery and upstream compatibility'
          git push origin HEAD:agent/adaptive-tool-discovery
