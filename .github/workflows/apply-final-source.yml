name: Apply final source for pull request 31

on:
  push:
    branches:
      - agent/adaptive-tool-discovery
    paths:
      - .github/final-source/READY

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: apply-final-source-pr31
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/adaptive-tool-discovery
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Decode and verify final source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/final-source/source.b64 > /tmp/pr31-final-source.tar.gz
          echo '17ad1374c3cdf1c4771c3028f54731fd4afae725ab8b94e3244b69d9a70aded7  /tmp/pr31-final-source.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/pr31-final-source.tar.gz > /tmp/pr31-final-source-files.txt
          if grep -E '(^|/)\.git(/|$)|(^|/)\.\./|(^|/)node_modules(/|$)' /tmp/pr31-final-source-files.txt; then
            echo 'Unsafe or local-only archive path detected.' >&2
            exit 1
          fi

      - name: Replace temporary branch contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/pr31-final-source.tar.gz -C .
          test ! -e .github/final-source
          test ! -e .github/workflows/apply-final-source.yml
          if find .github/workflows -maxdepth 1 -type f \( -name 'apply-complete-bundle*.yml' -o -name 'finalize-pr31*.yml' -o -name 'adaptive-tool-discovery-ci.yml' -o -name 'implementation-sync.yml' -o -name 'export-source.yml' -o -name 'export-dev-env.yml' \) | grep -q .; then
            echo 'Temporary workflow remained in final source.' >&2
            exit 1
          fi

      - name: Verify workflow policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'issues:[[:space:]]*write|gh[[:space:]]+issue|gh[[:space:]]+pr[[:space:]]+(close|merge)' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Final repository workflows must not mutate issues or other pull requests.' >&2
            exit 1
          fi
          while IFS= read -r line; do
            ref=${line#*@}; ref=${ref%% *}
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Unpinned GitHub Action: $line" >&2; exit 1; }
          done < <(grep -RhE '^[[:space:]]*-[[:space:]]+uses:' .github/workflows)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated dashboard
        shell: bash
        run: |
          set -euo pipefail
          cp src/apps/generated/dashboard.ts /tmp/dashboard-before.ts
          bun run build:dashboard
          cmp /tmp/dashboard-before.ts src/apps/generated/dashboard.ts

      - name: Typecheck, build, lint, and context budget
        run: |
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check

      - name: Verify deterministic upstream report
        shell: bash
        run: |
          set -euo pipefail
          bun run upstream:check:fixture > /tmp/upstream-a.md
          bun run upstream:check:fixture > /tmp/upstream-b.md
          diff -u /tmp/upstream-a.md /tmp/upstream-b.md

      - name: Install Chromium for focused validation
        run: bunx playwright install --with-deps chromium

      - name: Run focused contract and security tests
        run: |
          bunx playwright test tests/adaptive-config.spec.ts tests/mcp-tool-schema.spec.ts tests/tool-registry.spec.ts tests/tool-visibility.spec.ts tests/tool-search.spec.ts tests/tool-gateways.spec.ts tests/tool-context-budget.spec.ts tests/browser-find.spec.ts tests/http-allowed-hosts.spec.ts tests/output-manager.spec.ts tests/secret-redaction.spec.ts tests/mcp-resources.spec.ts tests/dashboard-build.spec.ts tests/dashboard-render.spec.ts tests/dashboard-e2e.spec.ts tests/upstream-check.spec.ts tests/upstream-config.spec.ts tests/review-threads.spec.ts --project=chromium

      - name: Verify packed package
        run: bun run test:package

      - name: Verify extension build
        run: |
          npm ci --prefix extension
          npm run build --prefix extension

      - name: Commit clean final source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report
          rm -f -- *.tgz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete tool discovery and upstream compatibility'
          git push origin HEAD:agent/adaptive-tool-discovery
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set pull request target and description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          This pull request consolidates the repository maintenance and architecture work into one reviewed change set.

          It includes:

          - all implementation and CI hardening from pull request #30
          - an adaptive MCP tool catalog with `adaptive`, `minimal`, and `full` profiles
          - deterministic tool discovery and schema-validated read-only/action gateways
          - compact accessibility-snapshot search and enforced context budgets
          - selected Microsoft Playwright MCP compatibility and security improvements while retaining the local lint and formatting toolchain
          - read-only upstream compatibility reporting and source attribution
          - an offline, opt-in MCP Apps dashboard replacing the implementation proposed in pull request #26
          - package-install, browser, extension, Docker, and protocol conformance coverage

          The default adaptive catalog exposes seven tools and keeps the serialized startup list below the enforced 12,000-byte budget. Existing static behavior remains available with `--tool-profile=full`.

          This pull request does not edit, close, label, or comment on repository issues or pull request #28.
          EOF
          gh pr edit 31 --repo "$GITHUB_REPOSITORY" --base main --title 'feat: improve tool discovery, upstream compatibility, and MCP Apps support' --body-file /tmp/pr-body.md

      - name: Wait for hosted checks on final commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 180); do
            current_sha=$(gh pr view 31 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            test "$current_sha" = "$FINAL_SHA"
            checks=$(gh pr checks 31 --repo "$GITHUB_REPOSITORY" --json name,state 2>/dev/null || echo '[]')
            count=$(jq length <<<"$checks")
            if [[ "$count" -gt 0 ]]; then found=true; break; fi
            sleep 10
          done
          test "$found" = true
          gh pr checks 31 --repo "$GITHUB_REPOSITORY" --watch --fail-fast

      - name: Resolve addressed pull request 31 review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for thread_id in PRRT_kwDOPYDXK86QLaDl PRRT_kwDOPYDXK86QLaDn PRRT_kwDOPYDXK86QLaDq; do
            gh api graphql -f threadId="$thread_id" -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{id isResolved}}}' >/dev/null
          done

      - name: Mark pull request 31 ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr ready 31 --repo "$GITHUB_REPOSITORY"

      - name: Supersede pull requests 30 and 26
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 30 --repo "$GITHUB_REPOSITORY" --body 'Superseded by #31, which incorporates this pull request and the subsequent compatibility, context-budget, dashboard, and CI work.'
          gh pr close 30 --repo "$GITHUB_REPOSITORY"
          gh pr comment 26 --repo "$GITHUB_REPOSITORY" --body 'Superseded by #31, which replaces the dashboard implementation with an offline, opt-in MCP Apps resource and includes CSP, XSS, and resource-contract tests.'
          gh pr close 26 --repo "$GITHUB_REPOSITORY"
