name: Finalize PR 31 directly

on:
  push:
    branches:
      - agent/pr31-final-review
    paths:
      - '.github/workflows/finalize-pr31-direct.yml'

permissions:
  contents: write

concurrency:
  group: finalize-pr31-direct
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-final-review
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Reconstruct and verify the prepared patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/pr31-review-fixes:refs/remotes/origin/agent/pr31-review-fixes
          cat scripts/apply-pr31-final.py.gz.b64.* > /tmp/pr31-payload.b64
          printf '%s  %s\n' \
            '6248edd96a856f8a59b05b8ac5cc8294ff3d8219eb13c20b2a4d23e6858b0022' \
            /tmp/pr31-payload.b64 | sha256sum --check
          base64 --decode /tmp/pr31-payload.b64 | gzip --decompress \
            > scripts/apply-pr31-final.py
          printf '%s  %s\n' \
            '6a95d924a4d0051c3db738f1e126776a51f3ab8185231cc24c49a7d7fa3a0d0d' \
            scripts/apply-pr31-final.py | sha256sum --check
          python3 -m py_compile scripts/apply-pr31-final.py
          chmod +x scripts/apply-pr31-final.py

      - name: Install the reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Generate corrected regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-pr31-final.py tests
          python3 - <<'PY'
          from pathlib import Path

          dialog = Path('tests/dialog-lifecycle.spec.ts')
          text = dialog.read_text(encoding='utf-8')
          text = text.replace(".join('\n');", ".join('\\\\n');")
          text = text.replace(
              "'<button onclick=\"alert('Alert from page')\">Open dialog</button>',",
              "`<button onclick=\"alert('Alert from page')\">Open dialog</button>`,",
          )
          dialog.write_text(text, encoding='utf-8')

          runtime = Path('tests/upstream-runtime.spec.ts')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace(
              "async (_fixtures, testInfo) => {",
              "async ({ page: _page }, testInfo) => {",
          )
          runtime.write_text(text, encoding='utf-8')
          PY
          bunx biome check tests/dialog-lifecycle.spec.ts tests/upstream-runtime.spec.ts

      - name: RED - prove the selected regressions fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bunx playwright test \
            tests/upstream-runtime.spec.ts \
            tests/dialog-lifecycle.spec.ts \
            tests/upstream-config.spec.ts \
            tests/network-origin-filter.spec.ts \
            tests/partial-snapshot-css.spec.ts \
            --project=chromium \
            --workers=1 > /tmp/pr31-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr31-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the regression suite to be red before implementation.' >&2
            exit 1
          fi

      - name: Apply review fixes and current Microsoft upstream ports
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view playwright@next version)"
          case "$version" in
            1.63.0-alpha-*) ;;
            *)
              echo "Unexpected playwright@next version: $version" >&2
              exit 1
              ;;
          esac
          PLAYWRIGHT_VERSION="$version" python3 scripts/apply-pr31-final.py implementation
          printf 'Applied Playwright version %s\n' "$version"

      - name: Install refreshed dependency graph
        run: bun install

      - name: Format, encode, typecheck, build, generate, and lint
        shell: bash
        run: |
          set -euo pipefail
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run update-readme
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check
          git diff --check

      - name: GREEN - focused review and upstream regressions
        shell: bash
        run: |
          set -euo pipefail
          bunx playwright test \
            tests/upstream-runtime.spec.ts \
            tests/upstream-config.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/mcp-server-initialize.spec.ts \
            tests/network-origin-filter.spec.ts \
            tests/output-manager.spec.ts \
            tests/partial-snapshot-css.spec.ts \
            tests/dialog-lifecycle.spec.ts \
            tests/readme-contract.spec.ts \
            tests/secret-redaction.spec.ts \
            tests/session-log-redaction.spec.ts \
            tests/tool-gateways.spec.ts \
            tests/upstream-check.spec.ts \
            --project=chromium \
            --workers=1

      - name: Full Chromium suite
        run: bunx playwright test --project=chromium --workers=2

      - name: Packed npm artifact smoke
        run: bun run test:package

      - name: Install all browser projects
        shell: bash
        run: |
          set -euo pipefail
          bunx playwright install --with-deps chrome msedge firefox webkit

      - name: Full Chrome suite
        run: bunx playwright test --project=chrome --workers=1

      - name: Full Microsoft Edge suite
        run: bunx playwright test --project=msedge --workers=1

      - name: Full Firefox suite
        run: bunx playwright test --project=firefox --workers=1

      - name: Full WebKit suite
        run: bunx playwright test --project=webkit --workers=1

      - name: Build and test the bundled extension
        shell: bash
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        run: |
          set -euo pipefail
          npm ci --prefix extension
          npm run build --prefix extension
          xvfb-run --auto-servernum bunx playwright test \
            --config=extension/playwright.config.ts \
            --workers=1

      - name: Docker build and CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          docker build -t fast-playwright-mcp-pr31:latest .
          docker run --rm fast-playwright-mcp-pr31:latest --version

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report
          rm -rf extension/dist extension/test-results extension/playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows
          git reset -- scripts/apply-pr31-final.py scripts/apply-pr31-final.py.gz.b64 scripts/apply-pr31-final.py.gz.b64.* scripts/materialize-pr31-final.sh
          if git diff --cached --quiet; then
            echo 'No source changes were produced.' >&2
            exit 1
          fi
          git commit -m 'fix: address PR review and refresh Playwright upstream'
          git push origin HEAD:agent/pr31-final-review

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finalize-pr31-failure
          path: |
            /tmp/pr31-red.log
            test-results/**/error-context.md
            playwright-report/**
            extension/test-results/**/error-context.md
            extension/playwright-report/**
          if-no-files-found: warn
          retention-days: 3
