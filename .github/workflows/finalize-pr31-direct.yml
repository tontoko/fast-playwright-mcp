name: Finalize pull request 31 source

on:
  push:
    branches:
      - agent/pr31-direct-final
    paths:
      - .github/workflows/finalize-pr31-direct.yml

permissions:
  contents: write

concurrency:
  group: finalize-pr31-direct
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/pr31-direct-final
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply confirmed lint correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/response.ts')
          source = path.read_text(encoding='utf-8')
          marker = "import { renderModalStates } from './tab.js';\n"
          if source.count(marker) != 1:
              raise SystemExit('Expected exactly one obsolete renderModalStates import')
          path.write_text(source.replace(marker, ''), encoding='utf-8', newline='\n')
          PY

      - name: Normalize lockfile and install dependencies
        run: bun install

      - name: Generate and verify bundled dashboard
        shell: bash
        run: |
          set -euo pipefail
          bun run build:dashboard
          echo '9772355c681b21a7b7aeaa158791f543267c0b38cb394bfbfa776b40d660c428  src/apps/generated/dashboard.ts' | sha256sum --check --strict

      - name: Typecheck
        run: bun run typecheck

      - name: Build package
        run: bun run build:publish

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr31-direct-final-lint
          path: lint.log
          if-no-files-found: warn
          retention-days: 7

      - name: Check context budget
        run: bun run benchmark:tools -- --check

      - name: Verify deterministic upstream report
        shell: bash
        run: |
          set -euo pipefail
          bun run upstream:check:fixture > /tmp/upstream-a.md
          bun run upstream:check:fixture > /tmp/upstream-b.md
          diff -u /tmp/upstream-a.md /tmp/upstream-b.md

      - name: Install Chromium for focused validation
        run: bunx playwright install --with-deps chromium

      - name: Run focused contract and security tests
        run: |
          bunx playwright test \
            tests/adaptive-config.spec.ts \
            tests/mcp-tool-schema.spec.ts \
            tests/tool-registry.spec.ts \
            tests/tool-visibility.spec.ts \
            tests/tool-search.spec.ts \
            tests/tool-gateways.spec.ts \
            tests/tool-context-budget.spec.ts \
            tests/browser-find.spec.ts \
            tests/http-allowed-hosts.spec.ts \
            tests/output-manager.spec.ts \
            tests/secret-redaction.spec.ts \
            tests/mcp-resources.spec.ts \
            tests/dashboard-build.spec.ts \
            tests/dashboard-render.spec.ts \
            tests/dashboard-e2e.spec.ts \
            tests/upstream-check.spec.ts \
            tests/upstream-config.spec.ts \
            tests/review-threads.spec.ts \
            tests/encoding-policy.spec.ts \
            --project=chromium

      - name: Verify packed package and extension build
        run: |
          bun run test:package
          npm ci --prefix extension
          npm run build --prefix extension

      - name: Commit clean verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib test-results playwright-report
          rm -f -- *.tgz lint.log
          rm .github/workflows/finalize-pr31-direct.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize adaptive tool discovery and compatibility work'
          git push origin HEAD:agent/pr31-direct-final
