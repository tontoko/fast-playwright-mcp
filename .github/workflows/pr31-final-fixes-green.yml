name: PR 31 final fixes GREEN

on:
  push:
    branches: [agent/pr31-final-fixes]
    paths:
      - '.github/workflows/pr31-final-fixes-green.yml'
      - 'package.json'
      - 'upstream.json'
      - 'docs/upstream-compatibility.md'
      - 'scripts/upstream-check.ts'
      - 'src/apps/dashboard/**'
      - 'src/extension/**'
      - 'src/session-log.ts'
      - 'src/tools/screenshot.ts'
      - 'src/utils/codegen.ts'
      - 'tests/cdp-relay-launch.spec.ts'
      - 'tests/cdp-relay-security.spec.ts'
      - 'tests/dashboard-refresh.spec.ts'
      - 'tests/session-log-eviction.spec.ts'
      - 'tests/screenshot-webp.spec.ts'
      - 'tests/upstream-dual-audit.spec.ts'
      - 'tests/upstream-check.spec.ts'
      - 'tests/upstream-runtime.spec.ts'

permissions:
  contents: write

concurrency:
  group: pr31-final-fixes-green
  cancel-in-progress: true

jobs:
  green:
    if: ${{ !contains(github.event.head_commit.message, '[green-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr31-final-fixes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Apply CDP relay launch and upgrade hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/extension/cdp-relay.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { httpAddressToString } from '../http-server.js';",
              "import { httpAddressToString, isHostAllowed } from '../http-server.js';",
              'HTTP server import',
          )

          replace_once(
              "const DANGEROUS_PROPS = new Set(['__proto__', 'constructor', 'prototype']);\n",
              """const DANGEROUS_PROPS = new Set(['__proto__', 'constructor', 'prototype']);

function isAllowedRelayOrigin(
  origin: string | undefined,
  boundHost: string
): boolean {
  if (!origin) {
    return true;
  }
  try {
    const url = new URL(origin);
    if (url.protocol !== 'http:' && url.protocol !== 'https:') {
      return true;
    }
    return isHostAllowed(url.host, boundHost, undefined);
  } catch {
    return false;
  }
}

export function isRelayUpgradeAllowed(
  hostHeader: string | undefined,
  origin: string | undefined,
  boundHost: string
): boolean {
  return (
    isHostAllowed(hostHeader, boundHost, undefined) &&
    isAllowedRelayOrigin(origin, boundHost)
  );
}

export function launchBrowserProcess(
  executablePath: string,
  args: readonly string[]
): Promise<void> {
  return new Promise((resolve, reject) => {
    let spawned = false;
    const child = spawn(executablePath, [...args], {
      windowsHide: true,
      detached: true,
      shell: false,
      stdio: 'ignore',
    });
    child.once('spawn', () => {
      spawned = true;
      child.unref();
      resolve();
    });
    child.on('error', (error) => {
      if (!spawned) {
        reject(error);
        return;
      }
      cdpRelayDebug('Detached browser process error:', error);
    });
  });
}
""",
              'relay helpers',
          )

          replace_once(
              """    this._wsHost = httpAddressToString(server.address()).replace(
      HTTP_TO_WS_REGEX,
      'ws'
    );
""",
              """    const httpAddress = httpAddressToString(server.address());
    this._wsHost = httpAddress.replace(HTTP_TO_WS_REGEX, 'ws');
    const boundHost = new URL(httpAddress).hostname;
""",
              'relay bound host',
          )

          replace_once(
              """    this._wss = new WebSocketServer({ server });
    this._wss.on('connection', this._onConnection.bind(this));
""",
              """    this._wss = new WebSocketServer({
      server,
      verifyClient: (info, done) => {
        const allowed = isRelayUpgradeAllowed(
          info.req.headers.host,
          info.origin,
          boundHost
        );
        if (allowed) {
          done(true);
        } else {
          done(false, 403, 'Forbidden');
        }
      },
    });
    this._wss.on('connection', this._onConnection.bind(this));
""",
              'relay WebSocket validation',
          )

          replace_once(
              """    if (this._userDataDir) {
      args.push(`--user-data-dir=${this._userDataDir}`);
      if (!this._executablePath) {
        const profile = await findExtensionProfile(
          this._userDataDir,
          extensionId
        );
        if (profile) {
          args.push(`--profile-directory=${profile}`);
        }
      }
    }
""",
              """    if (this._userDataDir) {
      args.push(`--user-data-dir=${this._userDataDir}`);
      const profile = await findExtensionProfile(
        this._userDataDir,
        extensionId
      );
      if (profile) {
        args.push(`--profile-directory=${profile}`);
      }
    }
""",
              'custom executable profile discovery',
          )

          replace_once(
              """    spawn(executablePath, args, {
      windowsHide: true,
      detached: true,
      shell: false,
      stdio: 'ignore',
    });
""",
              "    await launchBrowserProcess(executablePath, args);\n",
              'browser spawn boundary',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install refreshed dependencies and browser revision
        shell: bash
        run: |
          set -euo pipefail
          bun install
          bunx playwright install --with-deps chromium

      - name: Format and static verification
        shell: bash
        run: |
          set -euo pipefail
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run update-readme
          bun run lint-fix
          bun run check:encoding
          bun run typecheck
          bun run build:publish
          bun run lint
          bun run benchmark:tools -- --check
          bun run upstream:check:fixture > /tmp/upstream-report.md
          grep -q '## Playwright MCP' /tmp/upstream-report.md
          grep -q '## Playwright runtime' /tmp/upstream-report.md
          git diff --check

      - name: Focused final regressions
        shell: bash
        run: |
          set -euo pipefail
          bunx playwright test \
            tests/cdp-relay-launch.spec.ts \
            tests/cdp-relay-security.spec.ts \
            tests/dashboard-refresh.spec.ts \
            tests/session-log-eviction.spec.ts \
            tests/screenshot-webp.spec.ts \
            tests/upstream-dual-audit.spec.ts \
            tests/upstream-check.spec.ts \
            tests/upstream-runtime.spec.ts \
            tests/session-log.spec.ts \
            tests/session-log-redaction.spec.ts \
            tests/tool-gateways.spec.ts \
            --project=chromium \
            --workers=1

      - name: Full Chromium suite
        run: bunx playwright test --project=chromium --workers=2

      - name: Packed npm artifact smoke
        run: bun run test:package

      - name: Extension build and E2E
        shell: bash
        env:
          DEBUG: 'pw:mcp:*'
          PWMCP_DEBUG: '1'
        run: |
          set -euo pipefail
          npm ci --prefix extension
          npm run build --prefix extension
          xvfb-run --auto-servernum bunx playwright test \
            --config=extension/playwright.config.ts \
            --workers=1

      - name: Record verified source state
        shell: bash
        run: |
          set -euo pipefail
          printf '# PR 31 GREEN verification\n\n' > GREEN_RESULT.md
          printf -- '- static verification: passed\n' >> GREEN_RESULT.md
          printf -- '- focused regressions: passed\n' >> GREEN_RESULT.md
          printf -- '- full Chromium suite: passed\n' >> GREEN_RESULT.md
          printf -- '- package smoke: passed\n' >> GREEN_RESULT.md
          printf -- '- extension E2E: passed\n' >> GREEN_RESULT.md
          rm -rf lib test-results playwright-report extension/dist \
            extension/test-results extension/playwright-report
          rm -f -- *.tgz tsconfig.tsbuildinfo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete PR 31 review and upstream refresh [green-result]'
          git push origin HEAD:agent/pr31-final-fixes

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6
        with:
          name: pr31-final-fixes-failure
          path: |
            test-results/**/error-context.md
            playwright-report/**
            extension/test-results/**/error-context.md
            extension/playwright-report/**
          if-no-files-found: warn
          retention-days: 3
