# SonarQube Cloud automatic analysis configuration.
sonar.sourceEncoding=UTF-8
sonar.sources=src,extension/src,scripts,benchmark
sonar.tests=tests,extension/tests
sonar.exclusions=src/apps/generated/dashboard.ts,src/apps/generated,benchmark/reports
sonar.test.exclusions=tests/testserver,tests/review-threads/fixtures,tests/upstream/fixtures
sonar.cpd.exclusions=src/apps/generated
# browser_evaluate intentionally executes explicit user-provided code in the isolated browser page realm.
sonar.issue.ignore.multicriteria=browserEvaluate
sonar.issue.ignore.multicriteria.browserEvaluate.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.browserEvaluate.resourceKey=src/tools/evaluate.ts
